<!DOCTYPE html>
<html lang="hu" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="google" content="notranslate">
<meta http-equiv="Content-Language" content="hu">
<title>SI kártyák</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#E9EDF1; --panel:#FFFFFF; --ink:#14202B; --muted:#5B6B79; --line:#C9D1D9;
  --card:#14202B; --cardtext:#F4F6F8; --cardmuted:#9FB0BF; --accent:#F2A900; --accent-ink:#14202B;
  --ok:#2F7D5B; --no:#C2412D;
  --display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E151C; --panel:#16212B; --ink:#E8EDF2; --muted:#8D9DAB; --line:#2A3A49;
    --card:#1E2F3F; --cardtext:#F4F6F8; --cardmuted:#9FB0BF; --ok:#3FA377; --no:#E0624D;
  }
}
:root[data-theme="dark"]{
  --bg:#0E151C; --panel:#16212B; --ink:#E8EDF2; --muted:#8D9DAB; --line:#2A3A49;
  --card:#1E2F3F; --cardtext:#F4F6F8; --cardmuted:#9FB0BF; --ok:#3FA377; --no:#E0624D;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;}
main{max-width:560px;margin:0 auto;padding:18px 16px 40px;}
h1{font-family:var(--display);font-weight:700;font-size:40px;line-height:1;margin:6px 0 4px;letter-spacing:.01em;}
h2{font-family:var(--display);font-weight:600;font-size:24px;margin:0 0 4px;}
p{margin:0 0 10px;}
.sub{color:var(--muted);margin-bottom:18px;}
button{font:inherit;cursor:pointer;}
button:focus-visible,textarea:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:600;background:var(--accent);color:var(--accent-ink);min-height:48px;}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);}
.btn.small{padding:8px 12px;min-height:40px;font-size:14px;}
.btn.ok{background:var(--ok);color:#fff;}
.btn.no{background:var(--no);color:#fff;}
.opts{display:flex;flex-direction:column;gap:8px;margin:0 0 18px;padding:12px 14px;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;}
.opts label{display:flex;align-items:center;gap:10px;min-height:32px;}
.opts input{width:20px;height:20px;accent-color:var(--accent);}
.deck{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;}
.deck .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.deck .meta{color:var(--muted);font-size:14px;margin-bottom:10px;}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:12px;}
.bar > span{display:block;height:100%;background:var(--ok);}
.deck .acts{display:flex;gap:8px;flex-wrap:wrap;}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;}
.count{color:var(--muted);font-size:14px;}
.scene{perspective:1200px;margin-bottom:16px;}
.card{position:relative;width:100%;min-height:300px;height:52vh;max-height:420px;transform-style:preserve-3d;transition:transform .35s ease;cursor:pointer;touch-action:pan-y;}
.card.flipped{transform:rotateY(180deg);}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;background:var(--card);color:var(--cardtext);padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:auto;}
.face.back{transform:rotateY(180deg);border:3px solid var(--accent);}
.face .tag{position:absolute;top:12px;left:16px;right:16px;font-size:13px;color:var(--cardmuted);text-align:left;}
.face .txt{font-family:var(--display);font-weight:600;font-size:clamp(30px,9vw,48px);line-height:1.12;overflow-wrap:anywhere;}
.face .txt.long{font-size:clamp(22px,6vw,30px);font-family:var(--body);font-weight:500;line-height:1.35;}
.face .hint{position:absolute;bottom:12px;font-size:13px;color:var(--cardmuted);}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.answers[hidden]{display:none;}
.done{text-align:center;padding:30px 10px;}
.done .big{font-family:var(--display);font-weight:700;font-size:56px;line-height:1;margin-bottom:8px;}
textarea,input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:12px;}
textarea{min-height:200px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;}
.field{margin-bottom:14px;}
.field label{display:block;font-weight:600;margin-bottom:6px;}
.note{font-size:14px;color:var(--muted);}
.err{color:var(--no);font-weight:600;margin-bottom:10px;}
.hidden{display:none !important;}
.ggrid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px 6px;margin-bottom:18px;}
@media (min-width:700px){.ggrid{grid-template-columns:repeat(13,1fr);}}
.gcol{display:flex;flex-direction:column;gap:6px;}
.slot{min-height:52px;border:2px dashed var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;padding:2px;background:var(--panel);}
.slot.ok{border:2px solid var(--ok);}
.slot.bad{border:2px solid var(--no);}
.slot.locked{border-style:solid;}
.bank{display:flex;flex-wrap:wrap;gap:8px;min-height:64px;padding:10px;border:2px dashed var(--line);border-radius:12px;margin-bottom:14px;}
.chip{user-select:none;-webkit-user-select:none;touch-action:none;cursor:grab;border-radius:8px;padding:10px 12px;font-weight:600;min-width:48px;text-align:center;line-height:1.1;}
.chip.p{background:var(--accent);color:var(--accent-ink);font-size:17px;}
.chip.f{background:var(--card);color:var(--cardtext);font-family:var(--display);font-size:24px;}
.chip.sel{outline:3px solid var(--ink);outline-offset:2px;}
.chip.locked{cursor:default;}
.chip sup{font-size:.7em;line-height:0;}
.slot .chip{width:100%;min-width:0;padding:10px 1px;}
.slot .chip.p{font-size:14px;}
.slot .chip.f{font-size:19px;}
.dragghost{position:fixed;z-index:1000;pointer-events:none;margin:0;box-shadow:0 8px 20px rgba(0,0,0,.35);opacity:.95;}
.gl{font-weight:600;margin:0 0 6px;}
.gmsg{min-height:24px;font-weight:600;margin:12px 0;}
.gacts{display:flex;gap:8px;flex-wrap:wrap;}

.hub{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.hub .btn{width:100%;}
@media (max-width:420px){.hub{grid-template-columns:1fr;}}
.ptag{color:var(--muted);font-size:14px;margin-bottom:6px;}
h1 + .ptext{margin-top:12px;}
.ptext{font-size:18px;line-height:1.45;margin:0 0 16px;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:14px;}
.prow{margin-bottom:12px;}
.prow label{display:block;font-weight:600;margin-bottom:4px;}
.pin{display:flex;align-items:center;gap:8px;}
.pin input{flex:1;min-width:0;}
.pu{color:var(--muted);white-space:nowrap;}
.pin input.ok{border-color:var(--ok);border-width:2px;}
.pin input.bad{border-color:var(--no);border-width:2px;}
.pfb{color:var(--no);font-size:14px;font-weight:600;margin-top:3px;}
.pres{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:14px;margin-top:14px;}
.pres ol{margin:6px 0 0 18px;padding:0;}
.pres li{margin-bottom:4px;}
.pres ul{margin:6px 0 12px 18px;padding:0;}
.verdict{font-family:var(--display);font-size:28px;font-weight:700;margin:0 0 6px;}
.verdict.ok{color:var(--ok);}
.verdict.bad{color:var(--no);}
.hvl{display:flex;gap:10px;text-align:left;width:100%;background:var(--panel);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;min-height:48px;}
.hvl .hvn{font-weight:700;color:var(--muted);}
.hvl.bad{border-color:var(--no);border-width:2px;}
.hvl.good{border-color:var(--ok);border-width:2px;}
.hvl.pick{outline:3px solid var(--accent);}
.optgrid{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:14px;}
@media (min-width:640px){.optgrid{grid-template-columns:repeat(3,1fr);}}
.optg{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:8px;color:var(--ink);}
.optg.good{border-color:var(--ok);}
.optg.bad{border-color:var(--no);}
.optg.pick{outline:3px solid var(--accent);}
.optg svg{width:100%;height:auto;display:block;}
.zsec{margin:26px 0 8px;padding-top:8px;border-top:2px solid var(--accent);display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
.zsec h2{margin:0;}
.zq{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;}
.zq .ptext{background:transparent;border:0;padding:0;margin-bottom:10px;font-size:17px;}
.zqh{display:flex;justify-content:space-between;margin-bottom:8px;font-weight:600;}
.timer{font-variant-numeric:tabular-nums;}
.wrow{margin-bottom:12px;}
.wrow .wt{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:3px;}
.bigq{font-family:var(--display);font-weight:600;font-size:clamp(26px,7vw,40px);line-height:1.15;margin:10px 0 16px;overflow-wrap:anywhere;}

.hub .wide{grid-column:1/-1;}
.btab{width:100%;border-collapse:separate;border-spacing:4px 6px;table-layout:fixed;}
.btab th{text-align:left;font-size:13px;color:var(--muted);font-weight:600;padding:0 2px;}
.btab td{vertical-align:top;padding:0;}
.btab td.given{background:var(--card);color:var(--cardtext);border-radius:8px;padding:11px 8px;font-weight:600;min-height:44px;overflow-wrap:break-word;word-break:normal;hyphens:auto;}
@media (max-width:480px){.btab td.given{font-size:13px;padding:11px 6px;}.btab th{font-size:12px;}.btab input{font-size:14px;}}
.btab input{width:100%;min-width:0;padding:10px 6px;font-size:15px;}
.btab input.ok{border-color:var(--ok);border-width:2px;}
.btab input.bad{border-color:var(--no);border-width:2px;}
.btab .pfb{font-size:12px;line-height:1.25;overflow-wrap:anywhere;}

.kline{min-height:56px;border:2px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px;background:var(--panel);}
.kph{color:var(--muted);font-size:14px;}
.kbank{display:flex;flex-wrap:wrap;gap:8px;}
.ktk{font-family:var(--body);font-size:20px;font-weight:600;border-radius:8px;padding:8px 12px;min-width:44px;background:var(--card);color:var(--cardtext);border:0;}
.kline .ktk{background:var(--accent);color:var(--accent-ink);}
.tkb.used{opacity:.25;}
@media (prefers-reduced-motion: reduce){.card{transition:none;}}
</style>
</head>

/* ---------- Tárolás (hibatűrő) ---------- */
function load(key, def){ try{ var v=localStorage.getItem(key); return v?JSON.parse(v):def; }catch(e){ return def; } }
function save(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }

var custom = load('si_custom', []);
var known  = load('si_known', {});
var prefs  = load('si_prefs', {reverse:false, onlyUnknown:false});
var mem = {}; // ha a tárolás nem működik, a munkamenetben akkor is megmarad

function allDecks(){
  var b = BUILT.map(function(d){ return {id:d.id,name:d.name,desc:d.desc,custom:false,cards:d.cards}; });
  var c = custom.map(function(d){ return {id:d.id,name:d.name,desc:'Saját pakli',custom:true,cards:d.cards}; });
  return b.concat(c);
}
function keyOf(deck, card){ return deck.id+'|'+card[0]; }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }

var app = document.getElementById('app');
var session = null;

/* ---------- Tanulás ---------- */
function startStudy(id){
  var decks = allDecks();
  if(id!=='__all') decks = decks.filter(function(d){return d.id===id;});
  var list = [];
  decks.forEach(function(d){
    d.cards.forEach(function(c){
      var k = keyOf(d,c);
      if(prefs.onlyUnknown && known[k]) return;
      list.push({deckName:d.name, q:c[0], a:c[1], key:k});
    });
  });
  if(!list.length){
    app.innerHTML = '<div class="done"><div class="big">Kész!</div><p>Itt már minden kártyát tudsz. Kapcsold ki a „Csak amit még nem tudok” opciót, ha mégis át akarod nézni.</p><button class="btn" id="back">Vissza</button></div>';
    document.getElementById('back').onclick = home; return;
  }
  session = { queue:shuffle(list), total:list.length, learned:0, misses:0, flipped:false };
  render();
}

function render(){
  var s = session;
  if(!s.queue.length){
    app.innerHTML = '<div class="done"><div class="big">Végeztél!</div><p>'+s.total+' kártya, ebből '+s.misses+'-szor kellett újra próbálkozni.</p>'+
      '<button class="btn" id="again">Újra</button> <button class="btn ghost" id="back">Főoldal</button></div>';
    document.getElementById('back').onclick = home;
    document.getElementById('again').onclick = home;
    return;
  }
  var c = s.queue[0];
  var front = prefs.reverse ? c.a : c.q;
  var back  = prefs.reverse ? c.q : c.a;
  function cls(t){ return t.length>40 ? 'txt long' : 'txt'; }
  app.innerHTML =
    '<div class="topbar"><button class="btn ghost small" id="back">← Vissza</button><span class="count">hátra: '+s.queue.length+' / '+s.total+'</span></div>'+
    '<div class="scene"><div class="card'+(s.flipped?' flipped':'')+'" id="card" tabindex="0" role="button" aria-label="Kártya megfordítása">'+
      '<div class="face front"><div class="tag">'+esc(c.deckName)+'</div><div class="'+cls(front)+'">'+esc(front)+'</div><div class="hint">Koppints a megfordításhoz</div></div>'+
      '<div class="face back"><div class="tag">'+esc(c.deckName)+'</div><div class="'+cls(back)+'">'+esc(back)+'</div></div>'+
    '</div></div>'+
    '<div class="answers" id="ans"'+(s.flipped?'':' hidden')+'>'+
      '<button class="btn no" id="no">Még nem tudom</button>'+
      '<button class="btn ok" id="yes">Tudom</button></div>';
  document.getElementById('back').onclick = home;
  var card = document.getElementById('card');
  card.onclick = flip;
  card.onkeydown = function(e){ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); flip(); } };
  document.getElementById('no').onclick = function(){ answer(false); };
  document.getElementById('yes').onclick = function(){ answer(true); };

  var sx=null;
  card.addEventListener('touchstart',function(e){ sx=e.touches[0].clientX; },{passive:true});
  card.addEventListener('touchend',function(e){
    if(sx===null || !session.flipped) { sx=null; return; }
    var dx=e.changedTouches[0].clientX - sx; sx=null;
    if(Math.abs(dx)>70){ answer(dx>0); card.onclick=null; }
  },{passive:true});
}

function flip(){
  session.flipped = !session.flipped;
  document.getElementById('card').classList.toggle('flipped', session.flipped);
  document.getElementById('ans').hidden = !session.flipped;
}

function answer(ok){
  var s = session; if(!s || !s.queue.length) return;
  if(!s.flipped) return;
  var c = s.queue.shift();
  if(ok){ known[c.key]=true; }
  else { delete known[c.key]; s.misses++; s.queue.splice(Math.min(3,s.queue.length),0,c); }
  save('si_known',known);
  s.flipped = false;
  render();
}

document.addEventListener('keydown',function(e){
  if(!session || !session.queue.length) return;
  if(e.key==='ArrowRight' && session.flipped) answer(true);
  if(e.key==='ArrowLeft' && session.flipped) answer(false);
});

  var h = '<div class="topbar"><button class="btn ghost small" id="back">← Vissza</button></div>'+

    '<p class="sub">Másold ide a tananyagot soronként: <b>kérdés | válasz</b>. Tabulátorral vagy pontosvesszővel elválasztva is jó.</p>'+
    (typeof msg==='string'?'<div class="err">'+esc(msg)+'</div>':'')+
    '<div class="field"><label for="dn">Pakli neve</label><input type="text" id="dn" placeholder="pl. Gépész mértékegységek"></div>'+
    '<div class="field"><label for="tx">Kártyák</label><textarea id="tx" placeholder="erő | newton (N)&#10;nyomás | pascal (Pa)&#10;1 bar | 10⁵ Pa"></textarea></div>'+
    '<button class="btn" id="saveDeck">Pakli mentése</button>'+
    '<p class="note" style="margin-top:14px">A tanár oldalát ez az oldal nem tudja közvetlenül beolvasni. Nyisd meg a tanár oldalát, jelöld ki és másold ki a szöveget, majd illeszd be ide. Ha nem sorokba van rendezve, add oda a Claude-nak, és átalakítja ebbe a formába.</p>';
  app.innerHTML = h;

  document.getElementById('saveDeck').onclick = function(){
    var name = document.getElementById('dn').value.trim() || 'Saját pakli';

      if(parts.length<2) return;
      var q = parts[0].trim(), a = parts.slice(1).join(' | ').trim();
      if(q && a) cards.push([q,a]);
    });
    if(!cards.length){ importView('Nem találtam egyetlen kártyát sem. Soronként kérdés | válasz formában add meg.'); return; }

/* ---------- Váltószám-játék ---------- */
var GP=['12','9','6','3','2','1','0','−1','−2','−3','−6','−9','−12'];
var GF=['T','G','M','k','h','da','alap','d','c','m','µ','n','p'];
function powHTML(i){ return '10<sup>'+GP[i]+'</sup>'; }
var gs=null;

function gameNew(easy){
  var ids=[],i;
  for(i=0;i<13;i++) ids.push(i);
  gs={easy:!!easy,pw:[],pf:[],bp:shuffle(ids.slice()),bf:shuffle(ids.slice()),checked:false,msg:'',sel:null};
  for(i=0;i<13;i++){ gs.pw.push(null); gs.pf.push(easy?i:null); }
}

function gChip(kind,id,locked){
  var sel=gs.sel&&gs.sel.kind===kind&&gs.sel.id===id;
  return `<div class='chip ${kind}${locked?' locked':''}${sel?' sel':''}' data-kind='${kind}' data-id='${id}'>${kind==='p'?powHTML(id):esc(GF[id])}</div>`;
}

function gameView(){
  var s=gs,i,h='';
  app.style.maxWidth='900px';
  h+=`<div class='topbar'><button class='btn ghost small' id='gback'>← Vissza</button><span class='count'>húzd, vagy koppints</span></div>`;
  h+=`<h1>Váltószámok</h1><p class='sub'>Rakd sorba a váltószámokat nagytól kicsi felé, és párosítsd mindegyikhez az előtagját.</p>`;
  h+=`<div class='opts'><label><input type='checkbox' id='gEasy'${s.easy?' checked':''}> Könnyebb: az előtagok már a helyükön vannak</label></div>`;
  h+=`<div id='gwrap'><div class='ggrid'>`;
  for(i=0;i<13;i++){
    var pc='',fc='';
    if(s.checked){
      if(s.pw[i]!==null) pc=(s.pw[i]===i)?' ok':' bad';
      if(!s.easy&&s.pf[i]!==null) fc=(s.pf[i]===s.pw[i])?' ok':' bad';
    }
    h+=`<div class='gcol'><div class='slot p${pc}' data-kind='p' data-i='${i}'>${s.pw[i]!==null?gChip('p',s.pw[i],false):''}</div><div class='slot f${fc}${s.easy?' locked':''}' data-kind='f' data-i='${i}'>${s.pf[i]!==null?gChip('f',s.pf[i],s.easy):''}</div></div>`;
  }
  h+=`</div>`;
  h+=`<p class='gl'>Váltószámok</p><div class='bank' data-kind='p'>`+s.bp.filter(function(id){return s.pw.indexOf(id)<0;}).map(function(id){return gChip('p',id,false);}).join('')+`</div>`;
  if(!s.easy){
    h+=`<p class='gl'>Előtagok</p><div class='bank' data-kind='f'>`+s.bf.filter(function(id){return s.pf.indexOf(id)<0;}).map(function(id){return gChip('f',id,false);}).join('')+`</div>`;
  }
  h+=`<div class='gmsg' role='status' aria-live='polite'>${esc(s.msg)}</div>`;
  h+=`<div class='gacts'><button class='btn' id='gCheck'>Ellenőrzés</button><button class='btn ghost' id='gShuf'>Új keverés</button><button class='btn ghost' id='gSolve'>Megoldás</button></div></div>`;
  app.innerHTML=h;

  document.getElementById('gback').onclick=home;
  document.getElementById('gEasy').onchange=function(e){ save('si_game_easy',e.target.checked); gameNew(e.target.checked); gameView(); };
  document.getElementById('gCheck').onclick=gCheck;
  document.getElementById('gShuf').onclick=function(){ gameNew(gs.easy); gameView(); };
  document.getElementById('gSolve').onclick=function(){
    for(var k=0;k<13;k++){ gs.pw[k]=k; gs.pf[k]=k; }
    gs.checked=true; gs.msg='Ez a helyes sorrend és párosítás.'; gs.sel=null; gameView();
  };
  var w=document.getElementById('gwrap');
  w.addEventListener('pointerdown',gDown);
  w.addEventListener('click',gClick);
}

function gArr(kind){ return kind==='p'?gs.pw:gs.pf; }

function gPlaceAt(kind,id,i){
  var s=gs;
  if(kind==='f'&&s.easy) return;
  var arr=gArr(kind), origin=arr.indexOf(id), displaced=arr[i];
  if(origin===i){ s.sel=null; gameView(); return; }
  if(origin>=0) arr[origin]=null;
  arr[i]=id;
  if(origin>=0&&displaced!==null) arr[origin]=displaced;
  s.checked=false; s.msg=''; s.sel=null;
  gameView();
}

function gToBank(kind,id){
  if(kind==='f'&&gs.easy) return;
  var arr=gArr(kind), o=arr.indexOf(id);
  if(o>=0) arr[o]=null;
  gs.checked=false; gs.msg=''; gs.sel=null;
  gameView();
}

function gTap(kind,id){
  var s=gs;
  if(s.sel&&s.sel.kind===kind&&s.sel.id===id){ s.sel=null; }
  else if(s.sel&&s.sel.kind===kind){
    var idx=gArr(kind).indexOf(id);
    if(idx>=0&&!(kind==='f'&&s.easy)){ var prev=s.sel; s.sel=null; gPlaceAt(kind,prev.id,idx); return; }
    s.sel={kind:kind,id:id};
  } else { s.sel={kind:kind,id:id}; }
  gameView();
}

function gClick(e){
  var s=gs;
  if(!s||!s.sel||e.target.closest('.chip')) return;
  var slot=e.target.closest('.slot'), bank=e.target.closest('.bank');
  if(slot&&slot.getAttribute('data-kind')===s.sel.kind) gPlaceAt(s.sel.kind,s.sel.id,+slot.getAttribute('data-i'));
  else if(bank&&bank.getAttribute('data-kind')===s.sel.kind) gToBank(s.sel.kind,s.sel.id);
}

function gDown(e){
  var chip=e.target.closest('.chip');
  if(!chip||chip.classList.contains('locked')) return;
  e.preventDefault();
  var r=chip.getBoundingClientRect();
  var st={kind:chip.getAttribute('data-kind'),id:+chip.getAttribute('data-id'),x:e.clientX,y:e.clientY,dx:e.clientX-r.left,dy:e.clientY-r.top,ghost:null,moved:false,pid:e.pointerId};
  function move(ev){
    if(ev.pointerId!==st.pid) return;
    if(!st.moved&&Math.hypot(ev.clientX-st.x,ev.clientY-st.y)>6){
      st.moved=true;
      var g=chip.cloneNode(true);
      g.className+=' dragghost'; g.style.width=r.width+'px';
      document.body.appendChild(g); st.ghost=g; chip.style.opacity='.3';
    }
    if(st.moved){ st.ghost.style.left=(ev.clientX-st.dx)+'px'; st.ghost.style.top=(ev.clientY-st.dy)+'px'; }
  }
  function up(ev){
    if(ev.pointerId!==st.pid) return;
    document.removeEventListener('pointermove',move);
    document.removeEventListener('pointerup',up);
    document.removeEventListener('pointercancel',up);
    if(st.ghost) st.ghost.remove();
    chip.style.opacity='';
    if(st.moved){
      if(ev.type==='pointercancel') return;
      var t=document.elementFromPoint(ev.clientX,ev.clientY);
      var tgt=t&&t.closest('.slot,.bank');
      if(!tgt||tgt.getAttribute('data-kind')!==st.kind) return;
      if(tgt.classList.contains('bank')) gToBank(st.kind,st.id);
      else gPlaceAt(st.kind,st.id,+tgt.getAttribute('data-i'));
    } else {
      gTap(st.kind,st.id);
    }
  }
  document.addEventListener('pointermove',move);
  document.addEventListener('pointerup',up);
  document.addEventListener('pointercancel',up);
}

function gCheck(){
  var s=gs,pOk=0,fOk=0,i;
  for(i=0;i<13;i++){
    if(s.pw[i]===i) pOk++;
    if(s.pf[i]!==null&&s.pf[i]===s.pw[i]) fOk++;
  }
  s.checked=true; s.sel=null;
  if(pOk===13&&(s.easy||fOk===13)) s.msg='Tökéletes! Minden a helyén van.';
  else if(s.easy) s.msg=pOk+'/13 váltószám van a helyén.';
  else s.msg=pOk+'/13 váltószám van a helyén, '+fOk+'/13 előtag passzol a fölötte lévő váltószámhoz.';
  gameView();
}

/* ===================== GYAKORLÁS: feladatgenerátorok ===================== */
/*GEN-START*/
function rint(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
var SUPM={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻'};
function sup(n){return String(n).split('').map(function(c){return SUPM[c]||c;}).join('');}
function ex10(e){return '10'+sup(e);}
function pfmt(x){
  if(!isFinite(x)) return String(x);
  if(x===0) return '0';
  var ax=Math.abs(x);
  if(ax>=1e7||ax<1e-3){
    var e=Math.floor(Math.log10(ax)), m=x/Math.pow(10,e);
    m=+m.toPrecision(4);
    if(Math.abs(m)>=10){m=m/10;e+=1;}
    return String(m).replace('.',',')+'·10'+sup(e);
  }
  var r=+x.toPrecision(5), s=String(r);
  if(s.indexOf('e')>-1) s=r.toFixed(6).replace(/0+$/,'').replace(/\.$/,'');
  var parts=s.split('.'), ip=parts[0], neg=false;
  if(ip.charAt(0)==='-'){neg=true;ip=ip.slice(1);}
  if(ip.length>4) ip=ip.replace(/\B(?=(\d{3})+(?!\d))/g,'\u00a0');
  return (neg?'−':'')+ip+(parts[1]?','+parts[1]:'');
}
var G=9.81;
function par(x){return x<0?'('+pfmt(x)+')':pfmt(x);}
var PXE={'T':12,'G':9,'M':6,'k':3,'h':2,'da':1,'':0,'d':-1,'c':-2,'m':-3,'µ':-6,'n':-9,'p':-12};
function PT(q,unit,val,tol){return {q:q,unit:unit||'',val:val,tol:tol||0.015};}
function TX(q,txt,cs,alts){return {q:q,unit:'',txt:txt,cs:!!cs,alts:alts||[]};}

    var parts=[PT('v a 1. szakasz végén','m/s',v1),PT('v a 2. szakasz végén','m/s',v2),PT('v a 3. szakasz végén','m/s',v3),PT('teljes megtett út','m',tot)];
    if(s0) parts.push(PT('végállás s','m',s0+tot));
    var steps=['1. szakasz: v = '+v0+' + '+par(a1)+'·'+d1+' = '+pfmt(v1)+' m/s; Δs = '+v0+'·'+d1+' + ½·'+par(a1)+'·'+d1+'² = '+pfmt(s1)+' m',
               '2. szakasz (a = 0): v = '+pfmt(v1)+' m/s; Δs = '+pfmt(v1)+'·'+d2+' = '+pfmt(s2)+' m',
               '3. szakasz: v = '+pfmt(v2)+' + '+par(a3)+'·'+d3+' = '+pfmt(v3)+' m/s; Δs = '+pfmt(v2)+'·'+d3+' + ½·'+par(a3)+'·'+d3+'² = '+pfmt(s3)+' m',
               'Teljes megtett út: '+pfmt(s1)+' + '+pfmt(s2)+' + '+pfmt(s3)+' = '+pfmt(tot)+' m'];
    if(s0) steps.push('Végállás: s = s₀ + út = '+s0+' + '+pfmt(tot)+' = '+pfmt(s0+tot)+' m');
    steps.push('Minden szakasz végsebességét vidd tovább a következő szakasz kezdősebességének!');
    return {text:txt,parts:parts,steps:steps};
  }
}

function munkapontSet(){
  for(var tries=0;tries<400;tries++){
    var Q=pick([0.05,0.1,0.1,0.1]),b=pick([500,1000,1500]),d=pick([1000,2000,2500]),C=pick([10,20,25,30]),A=C+(b+d)*Q*Q;
    if(Math.abs(A-Math.round(A))<1e-9) return {Q:Q,b:b,d:d,C:C,A:Math.round(A)};
  }
  return {Q:0.1,b:1000,d:2000,C:20,A:50};
}

/* ---------- mozgás-modell a diagramokhoz ---------- */
function mkMotion(durs,v0fix){
  for(var tr=0;tr<400;tr++){
    var v=(v0fix!==undefined&&v0fix!==null)?v0fix:pick([0,0,4,6,8]),t=0,segs=[];
    for(var k=0;k<3;k++){
      var d=durs?durs[k]:pick([2,3,4]),ty=pick(['c','a','d']),a=0;
      if(ty==='c'&&v===0) ty='a';
      if(ty==='a') a=pick([1,1.5,2,3]);
      else if(ty==='d'){
        if(v<=0){ty='a';a=pick([1,2]);}
        else{var amax=v/d,c=[1,1.5,2,3].filter(function(x){return x<=amax+1e-9;});
          if(!c.length){ty='c';a=0;}else a=-pick(c);}
      }
      segs.push({t0:t,t1:t+d,a:a,v0:v,ty:ty});v=v+a*d;t+=d;
    }
    var set={};segs.forEach(function(s){set[s.ty]=1;});
    if(Object.keys(set).length>=2) return {segs:segs,T:t};
  }
}
function motionFromSegs(segs){return {segs:segs,T:segs[segs.length-1].t1};}

function genZhTargonca(){

  do{a2=pick([1,1.5,2,2.5,3]);t2=pick([2,3,4]);v2=v1+a2*t2;t3=pick([2,3,4,5]);a3=v2/t3;tries++;}
  while(Math.abs(a3*2-Math.round(a3*2))>1e-9&&tries<500);
  var T2=t1+t2,T=t1+t2+t3;

      steps:['1. szakasz (állandó sebesség): a₁ = 0','2. szakasz: a₂ = ('+pfmt(v2)+'−'+v1+')/'+t2+' = '+pfmt(a2)+' m/s²','3. szakasz: a₃ = (0−'+pfmt(v2)+')/'+t3+' = −'+pfmt(a3)+' m/s²']},
     {key:'2.b',pts:8,text:'Mekkora utat tesz meg a targonca az egyes szakaszokon, és összesen?',parts:[PT('Δs₁','m',s1),PT('Δs₂','m',s2),PT('Δs₃','m',s3),PT('összesen','m',tot)],
      steps:['1. szakasz: Δs₁ = '+v1+'·'+t1+' = '+pfmt(s1)+' m','2. szakasz: Δs₂ = '+v1+'·'+t2+' + ½·'+pfmt(a2)+'·'+t2+'² = '+pfmt(s2)+' m','3. szakasz: Δs₃ = '+pfmt(v2)+'·'+t3+' + ½·(−'+pfmt(a3)+')·'+t3+'² = '+pfmt(s3)+' m','Összesen: '+pfmt(s1)+'+'+pfmt(s2)+'+'+pfmt(s3)+' = '+pfmt(tot)+' m']},

      steps:['F₂ = m·a₂ = '+m+'·'+pfmt(a2)+' = '+pfmt(m*a2)+' N','F₃ = m·|a₃| = '+m+'·'+pfmt(a3)+' = '+pfmt(m*a3)+' N']},
     {key:'2.d',pts:7,mcq:true,text:'Melyik a mozgáshoz tartozó sebesség–idő (v–t) diagram?',
      steps:['A v–t diagram folytonos törtvonal: vízszintes '+v1+'-nél (0–'+t1+' s), emelkedik '+v1+'-ről '+pfmt(v2)+'-re ('+t1+'–'+T2+' s), majd csökken '+pfmt(v2)+'-ről 0-ra ('+T2+'–'+T+' s).']}

function fmtTime(ms){var s=Math.floor(ms/1000),m=Math.floor(s/60);s=s%60;return m+':'+(s<10?'0':'')+s;}

function pParse(s){
  s=String(s).trim().toLowerCase();
  s=s.replace(/\s|\u00a0/g,'').replace(/[−–]/g,'-').replace(/,/g,'.');
  s=s.replace(/10([⁰¹²³⁴⁵⁶⁷⁸⁹⁻]+)/g,function(m,g){return '10^'+g.split('').map(function(c){var k='⁰¹²³⁴⁵⁶⁷⁸⁹⁻'.indexOf(c);return k===10?'-':String(k);}).join('');});
  s=s.replace(/[·x*×]10\^?([+-]?\d+)$/,'e$1');
  s=s.replace(/^10\^([+-]?\d+)$/,'1e$1');
  if(!/^[+-]?(\d+\.?\d*|\.\d+)(e[+-]?\d+)?$/.test(s)) return NaN;
  return parseFloat(s);
}
function pCheckPart(p,raw){
  if(p.txt!==undefined){
    var t=String(raw).trim();if(t==='') return false;
    var acc=[p.txt].concat(p.alts||[]);
    if(p.cs){var x=symNorm(t);return acc.some(function(a){return symNorm(a)===x;});}
    var nn=nrm(t);return acc.some(function(a){return nrm(a)===nn;});
  }
  var v=pParse(raw);if(isNaN(v)) return false;
  if(Math.abs(p.val)<1e-12) return Math.abs(v)<1e-6;
  return Math.abs(v-p.val)/Math.abs(p.val)<=p.tol;
}

function weightedPick(pool,weak){
  if(!weak) return pick(pool);
  var w=pool.map(function(t){var s=pstats[t.id];if(!s||s.n<2) return 2;return 1+3*(1-s.ok/s.n);});
  var sum=w.reduce(function(a,b){return a+b;},0),r=Math.random()*sum;
  for(var i=0;i<pool.length;i++){r-=w[i];if(r<=0) return pool[i];}
  return pool[pool.length-1];
}

/* ---------- Diagram-gyakorlat ---------- */
function dgPts(m,kind){
  var pts=[],s=0;
  m.segs.forEach(function(g){
    var d=g.t1-g.t0;
    if(kind==='a'){pts.push([g.t0,g.a]);pts.push([g.t1,g.a]);}
    else if(kind==='v'){pts.push([g.t0,g.v0]);pts.push([g.t1,g.v0+g.a*d]);}
    else{for(var k=0;k<=12;k++){var tau=d*k/12;pts.push([g.t0+tau,s+g.v0*tau+0.5*g.a*tau*tau]);}s+=g.v0*d+0.5*g.a*d*d;}
  });
  return pts;
}
function dgSVG(m,kind){
  var pts=dgPts(m,kind),W=240,H=140,L=38,R=8,T=14,B=22;
  var ys=pts.map(function(p){return p[1];}),dmin=Math.min.apply(null,ys),dmax=Math.max.apply(null,ys);
  var ymin=Math.min(0,dmin),ymax=Math.max(0,dmax);
  if(ymax===ymin) ymax=ymin+1;
  var pad=(ymax-ymin)*0.1;if(ymin<0) ymin-=pad;ymax+=pad;
  function X(t){return L+(W-L-R)*t/m.T;}
  function Y(y){return T+(H-T-B)*(ymax-y)/(ymax-ymin);}
  var d=pts.map(function(p,i){return (i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1);}).join(' ');
  var name={a:'a [m/s²]',v:'v [m/s]',s:'s [m]'}[kind];
  var svg="<svg viewBox='0 0 "+W+" "+H+"' role='img' aria-label='"+kind+"–t diagram'>"+
    "<line x1='"+L+"' y1='"+Y(0)+"' x2='"+(W-R)+"' y2='"+Y(0)+"' stroke='var(--line)' stroke-width='1.5'/>"+
    "<line x1='"+L+"' y1='"+T+"' x2='"+L+"' y2='"+(H-B)+"' stroke='var(--line)' stroke-width='1.5'/>"+
    "<path d='"+d+"' fill='none' stroke='var(--ink)' stroke-width='2.4' stroke-linejoin='round'/>"+
    "<text x='"+(L+4)+"' y='"+(T-3)+"' font-size='9' fill='var(--muted)'>"+name+"</text>";
  m.segs.map(function(g){return g.t0;}).concat([m.T]).forEach(function(t){
    svg+="<text x='"+X(t)+"' y='"+(H-8)+"' font-size='9' text-anchor='middle' fill='var(--muted)'>"+t+"</text>";
  });
  svg+="<text x='"+(L-4)+"' y='"+(H-8)+"' font-size='9' text-anchor='end' fill='var(--muted)'>t [s]</text>";
  var labs={};labs[0]=1;if(dmax!==0) labs[dmax]=1;if(dmin<0) labs[dmin]=1;
  Object.keys(labs).forEach(function(k){svg+="<text x='"+(L-4)+"' y='"+(Y(+k)+3)+"' font-size='9' text-anchor='end' fill='var(--muted)'>"+pfmt(+k)+"</text>";});
  return svg+"</svg>";
}
function dgSig(m,kind){return JSON.stringify(dgPts(m,kind).map(function(p){return [Math.round(p[0]*10)/10,Math.round(p[1]*10)/10];}));}
function dgText(m){
  return 'Mozgás: '+m.segs.map(function(g){
    var d=g.t1-g.t0,v1=g.v0+g.a*d,x;
    if(g.ty==='c') x='állandó sebességgel halad (v = '+pfmt(g.v0)+' m/s)';
    else if(g.ty==='a') x='egyenletesen gyorsul (v: '+pfmt(g.v0)+' → '+pfmt(v1)+' m/s)';
    else x='egyenletesen lassul (v: '+pfmt(g.v0)+' → '+pfmt(v1)+' m/s)';
    return g.t0+'–'+g.t1+' s: '+x;
  }).join('; ')+'.';
}
function dgOptions(m,kind){
  var correct=dgSig(m,kind),sigs=[correct],opts=[m],tries=0;
  var durs=m.segs.map(function(g){return g.t1-g.t0;});
  while(opts.length<3&&tries<400){
    tries++;var o=mkMotion(durs,m.segs[0].v0);if(!o) continue;
    var sg=dgSig(o,kind);if(sigs.indexOf(sg)>-1) continue;
    sigs.push(sg);opts.push(o);
  }
  return opts;
}
var DG={m:null,kind:'v',opts:[],ci:0,done:false,n:0,ok:0};

}

  DG.opts.forEach(function(o,i){h+="<button class='optg' data-i='"+i+"'>"+dgSVG(o.m,DG.kind)+"</button>";});

   "<ul><li>Az a–t diagram lépcsős: a töréspontoknál ugrik, nem folytonos.</li><li>A v–t diagram folytonos törtvonal; a meredeksége a gyorsulás, a görbe alatti terület a megtett út.</li><li>Az s–t meredeksége a sebesség: a gyorsuló szakaszon felfelé hajló, az egyenletesen egyenes, a lassulón ellaposodó.</li></ul><button class='btn' id='dgNext'>Következő</button></div>";

    if(ZH.done) return;ZH.sel=+b.getAttribute('data-zi');
    [].forEach.call(app.querySelectorAll('[data-zi]'),function(x){x.classList.remove('pick');});b.classList.add('pick');
  };});
}
function zhGrade(score){
  if(score<=50) return 'elégtelen';if(score<=60) return 'elégséges';if(score<=72) return 'közepes';if(score<=85) return 'jó';return 'jeles';
}
function zhSubmit(){
  var Z=ZH;if(Z.done) return;Z.done=true;stopTimer();
  var ms=Date.now()-Z.t0,rows=[],total=0;
  // beugró
  var bOk=0,bAll=0;
  Z.b.forEach(function(q,i){
    var okc=pGrade(q.parts,'zb'+i+'_');bOk+=okc;bAll+=q.parts.length;
    document.getElementById('zb'+i+'_res').innerHTML="<div class='pres'>"+stepsHTML(q.steps)+"</div>";
  });
  var bPass=bOk/bAll>=0.51;
  pRecord('zh-1',bPass);
  function sub(q,pre,tag,sel){
    var pts,okc,full;
    if(q.mcq){
      var good=Z.sel!==null&&Z.mcq[Z.sel].c;
      var bs=app.querySelectorAll('[data-zi]');
      Z.mcq.forEach(function(o,j){if(o.c) bs[j].classList.add('good');});
      if(Z.sel!==null&&!good) bs[Z.sel].classList.add('bad');
      pts=good?q.pts:0;full=good;
    }else{
      okc=pGrade(q.parts,pre);pts=q.pts*okc/q.parts.length;full=okc===q.parts.length;
    }
    total+=pts;
    document.getElementById(pre+'res').innerHTML="<div class='pres'><div class='verdict "+(full?'ok':'bad')+"'>"+(Math.round(pts*10)/10).toString().replace('.',',')+" / "+q.pts+" pont</div>"+stepsHTML(q.steps)+"</div>";
    pRecord(tag,full);
    rows.push([q.key,pts,q.pts]);
  }
  Z.t.subs.forEach(function(q,i){sub(q,'zt'+i+'_','zh-2'+q.key.slice(-1));});
  Z.h.subs.forEach(function(q,i){sub(q,'zh'+i+'_','zh-3'+q.key.slice(-1));});
  var sc=Math.round(total),g=zhGrade(sc);
  var h="<div class='pres'><div class='verdict "+(sc>50?'ok':'bad')+"'>"+sc+" / 100 pont: "+g+"</div><p>Beugró: <b>"+(bPass?'megfelelt':'nem felelt meg')+"</b> ("+bOk+" / "+bAll+" helyes). A valódi ZH-n a beugró a folytatás feltétele.</p><p>Idő: "+fmtTime(ms)+"</p>"+
   "<p class='note'>Ponthatárok a tanár szerint: ≤50 elégtelen · 51–60 elégséges · 61–72 közepes · 73–85 jó · 86+ jeles. A részpontozás becslés: az alkérdésen belüli jó részeredményeket arányosan számoltam, a tanár pontos pontozását nem ismerem.</p>"+
   "<div class='gacts'><button class='btn' id='zAgain'>Új minta ZH</button></div></div>";
  document.getElementById('zhSummary').innerHTML=h;
  document.getElementById('zAgain').onclick=zhStart;
  document.getElementById('zhSummary').scrollIntoView({behavior:'smooth',block:'start'});
  var sb=document.getElementById('zSubmit');if(sb) sb.disabled=true;
}

 bu('m',['méter'],['hosszúság'],'alap'),

];
var BU_PREF=[['tera',['terra'],'T',12],['giga',[],'G',9],['mega',[],'M',6],['kilo',[],'k',3],['hekto',['hecto'],'h',2],['deka',['deca'],'da',1],['deci',[],'d',-1],['centi',[],'c',-2],['milli',[],'m',-3],['mikro',['micro'],'µ',-6],['nano',[],'n',-9],['piko',['pico'],'p',-12]].map(function(x){return {id:'p:'+x[2],names:[x[0]].concat(x[1]),sym:x[2],e:x[3]};});
STATNAME['bu-egyseg']='SI beugró: mértékegységek (jel, név, mennyiség)';

var buMiss=load('si_bu_miss',{});
var BU={kind:'egyseg',tables:[],t0:0,done:false};

function nrm(x){return String(x).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();}
function symNorm(x){return String(x).replace(/\s+/g,'').replace(/[·*⋅.]/g,'').replace(/\^2|²/g,'2').replace(/\^3|³/g,'3').replace(/μ/g,'µ').replace(/_/g,'');}
function buShow(c,it){
  if(c.type==='sym'||c.type==='psym') return it.sym;
  if(c.type==='name'||c.type==='pname') return it.names[0];
  if(c.type==='qty') return it.qtys[0];
  return '10'+sup(it.e);
}
function buCheck(c,it,raw){
  var t=c.type;
  if(t==='sym'){var x=symNorm(raw);return [it.sym].concat(it.alts).some(function(a){return symNorm(a)===x;});}
  if(t==='psym'){var y=symNorm(raw);return y===symNorm(it.sym)||(it.sym==='µ'&&y==='u');}
  if(t==='name'||t==='pname'){var n=nrm(raw);return n!==''&&it.names.some(function(a){return nrm(a)===n;});}
  if(t==='qty'){var q=nrm(raw);return q!==''&&it.qtys.some(function(a){return nrm(a)===q;});}
  var v=pParse(raw);if(isNaN(v)) return false;
  var tv=Math.pow(10,it.e);
  return Math.abs(v-tv)<=Math.abs(tv)*1e-6||v===it.e;
}
function buWeighted(pool,n){
  var items=pool.slice(),out=[];
  while(out.length<n&&items.length){
    var w=items.map(function(x){return 1+2*Math.min(3,buMiss[x.id]||0);});
    var sum=w.reduce(function(a,b){return a+b;},0),r=Math.random()*sum,k=0;
    for(;k<items.length-1;k++){r-=w[k];if(r<=0) break;}
    out.push(items.splice(k,1)[0]);
  }
  return out;
}
function buUnitTable(){
  var sc=load('si_bu_scope',{alap:true,szarm:false,oss:false,egyeb:false});
  var pool=BU_UNITS.filter(function(u){return sc[u.tier];});
  if(!pool.length) pool=BU_UNITS.filter(function(u){return u.tier==='alap'||u.tier==='szarm';});
  var items=buWeighted(pool,12);
  var rows=items.map(function(it){
    var dup=items.some(function(o){return o!==it&&o.qtys[0]===it.qtys[0];});
    var g=pick(dup?['sym','name']:['sym','name','qty']);
    return {item:it,cells:[{type:'sym',given:g==='sym'},{type:'name',given:g==='name'},{type:'qty',given:g==='qty'}]};
  });
  return {stat:'bu-egyseg',title:'Mértékegységek',heads:['Mértékegység (jele)','Megnevezés','Mennyiség'],rows:rows};
}
function buPrefTable(){
  var items=buWeighted(BU_PREF,12);
  var rows=items.map(function(it){
    var g=pick(['pname','psym','pexp']);
    return {item:it,cells:[{type:'pname',given:g==='pname'},{type:'psym',given:g==='psym'},{type:'pexp',given:g==='pexp'}]};
  });
  return {stat:'bu-elotag',title:'Előtagok és váltószámok',heads:['Előtag neve','Jele','Váltószám (10 a …)'],rows:rows};
}

  h+="<div class='hub' style='margin-top:12px'><button class='btn wide' data-bu='alap'>SI alapmennyiségek (0.a)</button><button class='btn' data-bu='egyseg'>Más mértékegységek</button><button class='btn' data-bu='elotag'>Előtagok</button><button class='btn wide' data-bu='mind'>Alapmennyiségek + előtagok</button></div>";

    buStart(b.getAttribute('data-bu'));
  };});

function buRender(){
  app.style.maxWidth='760px';
  var h=pTop('buBack',BU.kind==='mind'?"<span class='timer' id='buTimer'>0:00</span>":'')+"<h1>SI beugró</h1><p class='sub'>Soronként egy cella adott, a többit töltsd ki. A kis- és nagybetű számít (m ≠ M, k ≠ K), az ékezeteket nem kell pontosan beírni. A váltószámot így is megadhatod: 10^6, vagy csak 6.</p><div id='buSummary'></div>";
  BU.tables.forEach(function(t,ti){
    h+="<h2 style='margin-top:18px'>"+esc(t.title)+"</h2><table class='btab'><thead><tr>"+t.heads.map(function(x){return '<th>'+esc(x)+'</th>';}).join('')+"</tr></thead><tbody>";
    t.rows.forEach(function(r,ri){
      h+='<tr>'+r.cells.map(function(c,ci){
        if(c.given) return "<td class='given'>"+esc(buShow(c,r.item))+"</td>";

      }).join('')+'</tr>';
    });

function buSubmit(){
  if(BU.done) return;BU.done=true;stopTimer();
  var tot=0,okc=0,rowsAll=0,rowsOk=0;
  BU.tables.forEach(function(t,ti){
    var tr=0,tok=0;
    t.rows.forEach(function(r,ri){
      var rowOk=true;
      r.cells.forEach(function(c,ci){
        if(c.given) return;
        var id='bu'+ti+'_'+ri+'_'+ci,el=document.getElementById(id),ok=buCheck(c,r.item,el.value);
        tot++;if(ok) okc++;else rowOk=false;
        el.classList.add(ok?'ok':'bad');el.readOnly=true;
        document.getElementById(id+'fb').textContent=ok?'':'Helyes: '+buShow(c,r.item);
      });
      var k=r.item.id;buMiss[k]=rowOk?Math.max(0,(buMiss[k]||0)-1):(buMiss[k]||0)+1;
      pRecord(t.stat,rowOk);rowsAll++;if(rowOk) rowsOk++;
    });
  });
  save('si_bu_miss',buMiss);
  var pct=Math.round(100*okc/tot);
  document.getElementById('buSummary').innerHTML="<div class='pres'><div class='verdict "+(pct>=51?'ok':'bad')+"'>"+okc+" / "+tot+" cella helyes ("+pct+"%)</div><p>"+rowsOk+" / "+rowsAll+" sor teljesen jó."+(BU.kind==='mind'?" Idő: "+fmtTime(Date.now()-BU.t0)+".":'')+"</p><p class='note'>A tanár szerint a beugró feltétele legalább elégséges szint. A pontos beugró-határt nem ismerem, ez csak tájékoztató. A pirossal jelölt sorokból a következő táblázatban több jön.</p></div>";
  document.getElementById('buSummary').scrollIntoView({behavior:'smooth',block:'start'});
}

function agvSegs(P){
  var S=[],vs=P.v0,tp=0,k;

  return S;
}
function agvMotionOf(v0,ends,T,s0){
  var segs=[],vs=v0,tp=0;
  for(var i=0;i<3;i++){segs.push({t0:tp,t1:T[i],a:(ends[i]-vs)/(T[i]-tp),v0:vs});vs=ends[i];tp=T[i];}
  return {segs:segs,T:T[2],s0:s0||0};
}
function dgPts2(m,kind){
  var pts=[],s=m.s0||0;
  m.segs.forEach(function(g){
    var d=g.t1-g.t0;
    if(kind==='a'){pts.push([g.t0,g.a]);pts.push([g.t1,g.a]);}
    else if(kind==='v'){pts.push([g.t0,g.v0]);pts.push([g.t1,g.v0+g.a*d]);}
    else{for(var k=0;k<=12;k++){var tau=d*k/12;pts.push([g.t0+tau,s+g.v0*tau+0.5*g.a*tau*tau]);}s+=g.v0*d+0.5*g.a*d*d;}
  });
  return pts;
}
function dgSig2(m,kind){return JSON.stringify(dgPts2(m,kind).map(function(p){return [Math.round(p[0]*10)/10,Math.round(p[1]*10)/10];}));}
function agvDiagOptions(P,kind){
  var base=agvMotionOf(P.v0,P.v,P.T,P.s0),sigs=[dgSig2(base,kind)],opts=[{m:base,c:true}],tries=0;
  while(opts.length<3&&tries<800){
    tries++;
    var v0=P.v0,e=P.v.slice(),T=P.T.slice(),op=rint(0,4),k=rint(0,2);
    if(op===0){var t=e[0];e[0]=e[2];e[2]=t;}
    else if(op===1){e[k]=Math.max(0,e[k]+pick([-3,-2,2,3]));}
    else if(op===2){v0=Math.max(0,v0+pick([-3,-2,2,3]));}
    else if(op===3){var d=[T[0],T[1]-T[0],T[2]-T[1]].reverse();T=[d[0],d[0]+d[1],d[0]+d[1]+d[2]];}
    else{var pv=k===0?v0:e[k-1];e[k]=Math.max(0,2*pv-e[k]);}
    var m=agvMotionOf(v0,e,T,P.s0),sg=dgSig2(m,kind);
    if(sigs.indexOf(sg)>-1) continue;
    sigs.push(sg);opts.push({m:m,c:false});
  }

}

/* ---------- részletes diagram (értékekkel) ---------- */
function dgSVG2(m,kind){
  var pts=dgPts2(m,kind),W=270,H=160,L=30,R=14,T=22,B=24;
  var ys=pts.map(function(p){return p[1];}),dmin=Math.min.apply(null,ys),dmax=Math.max.apply(null,ys);
  var ymin=Math.min(0,dmin),ymax=Math.max(0,dmax);if(ymax===ymin) ymax=ymin+1;
  var pad=(ymax-ymin)*0.15;ymax+=pad;if(ymin<0) ymin-=pad;
  function X(t){return L+(W-L-R)*t/m.T;}
  function Y(y){return T+(H-T-B)*(ymax-y)/(ymax-ymin);}
  var d=pts.map(function(p,i){return (i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1);}).join(' ');
  var name={a:'a [m/s²]',v:'v [m/s]',s:'s [m]'}[kind];
  var svg="<svg viewBox='0 0 "+W+" "+H+"' role='img' aria-label='"+kind+"–t diagram'>";
  var bt=[0].concat(m.segs.map(function(g){return g.t1;}));
  bt.forEach(function(t){svg+="<line x1='"+X(t)+"' y1='"+T+"' x2='"+X(t)+"' y2='"+(H-B)+"' stroke='var(--line)' stroke-width='1' stroke-dasharray='3 3'/><text x='"+X(t)+"' y='"+(H-9)+"' font-size='9.5' text-anchor='middle' fill='var(--muted)'>"+t+"</text>";});
  svg+="<line x1='"+L+"' y1='"+Y(0)+"' x2='"+(W-R)+"' y2='"+Y(0)+"' stroke='var(--muted)' stroke-width='1.3'/><line x1='"+L+"' y1='"+T+"' x2='"+L+"' y2='"+(H-B)+"' stroke='var(--muted)' stroke-width='1.3'/>";
  svg+="<path d='"+d+"' fill='none' stroke='var(--ink)' stroke-width='2.4' stroke-linejoin='round'/><text x='"+(L+4)+"' y='"+(T-8)+"' font-size='9.5' fill='var(--muted)'>"+name+"</text><text x='"+(L-8)+"' y='"+(H-9)+"' font-size='9.5' text-anchor='end' fill='var(--muted)'>t [s]</text>";
  var lab=[];
  if(kind==='a') m.segs.forEach(function(g){lab.push([(g.t0+g.t1)/2,g.a,'a']);});
  else{
    var s=m.s0||0;
    bt.forEach(function(t,i){
      var y;
      if(kind==='v'){y=i===0?m.segs[0].v0:m.segs[i-1].v0+m.segs[i-1].a*(m.segs[i-1].t1-m.segs[i-1].t0);}
      else{if(i>0){var g=m.segs[i-1],dd=g.t1-g.t0;s+=g.v0*dd+0.5*g.a*dd*dd;}y=s;}
      lab.push([t,y,kind]);
    });
  }
  lab.forEach(function(l){
    var x=X(l[0]),yy=Y(l[1]),anc=l[2]==='a'?'middle':(l[0]===0?'start':(l[0]===m.T?'end':'middle'));
    if(l[2]!=='a') svg+="<circle cx='"+x+"' cy='"+yy+"' r='2.6' fill='var(--ink)'/>";
    svg+="<text x='"+(anc==='start'?x+3:(anc==='end'?x-3:x))+"' y='"+(l[2]==='a'&&l[1]<0?yy+13:yy-6)+"' font-size='9.5' font-weight='600' text-anchor='"+anc+"' fill='var(--ink)'>"+pfmt(l[1])+"</text>";
  });
  return svg+"</svg>";
}

var KB=KBRAW.map(function(r){return {id:r[0],l:r[1],e:r[2],p:r[3],tok:ktok(r[2])};});

function kbCompile(tk){
  var pos=0,names={};
  function peek(){return tk[pos];}
  function isStart(t){return t!==undefined&&(/^[\p{L}]/u.test(t)||/^\d/.test(t)||t==='('||t==='√'||t==='½');}
  function mul(a,b){return function(e){return a(e)*b(e);};}
  function div(a,b){return function(e){return a(e)/b(e);};}
  function primary(){
    var t=tk[pos++];
    if(t===undefined) throw 0;
    if(t==='½') return function(){return 0.5;};
    if(/^\d/.test(t)){var n=parseFloat(t.replace(',','.'));return function(){return n;};}
    if(/^[\p{L}]/u.test(t)){names[t]=1;return function(e){return e[t];};}
    if(t==='('){var v=expr();if(tk[pos++]!==')') throw 0;return v;}
    if(t==='√'){var a=primary();return function(e){return Math.sqrt(a(e));};}
    if(t==='|'){var b=expr();if(tk[pos++]!=='|') throw 0;return function(e){return Math.abs(b(e));};}
    throw 0;
  }
  function power(){
    var v=primary();
    while(peek()==='²'||peek()==='³'){var p=tk[pos++]==='²'?2:3;v=(function(w,q){return function(e){return Math.pow(w(e),q);};})(v,p);}
    return v;
  }
  function unary(){
    if(peek()==='−'||peek()==='-'){pos++;var u=unary();return function(e){return -u(e);};}
    return power();
  }
  function term(){
    var v=unary();
    for(;;){
      var t=peek();
      if(t==='·'||t==='×'){pos++;v=mul(v,unary());}
      else if(t==='/'||t==='÷'){pos++;v=div(v,unary());}
      else if(isStart(t)&&/^\d/.test(tk[pos-1]||'')){v=mul(v,power());}
      else break;
    }
    return v;
  }
  function expr(){
    var v=term();
    while(peek()==='+'||peek()==='−'||peek()==='-'){
      var op=tk[pos++],r=term();
      v=(function(a,b,o){return function(e){return o==='+'?a(e)+b(e):a(e)-b(e);};})(v,r,op);
    }
    return v;
  }
  try{var f=expr();if(pos!==tk.length) return null;return {f:f,names:names};}catch(x){return null;}
}
function kbSplit(tk){var i=tk.indexOf('=');if(i<1||i!==tk.lastIndexOf('=')||i===tk.length-1) return null;return [tk.slice(0,i),tk.slice(i+1)];}
function kbEq(a,b){
  var A=kbSplit(a),B=kbSplit(b);if(!A||!B) return false;
  var a0=kbCompile(A[0]),a1=kbCompile(A[1]),b0=kbCompile(B[0]),b1=kbCompile(B[1]);
  if(!a0||!a1||!b0||!b1) return false;
  var names={};[a0,a1,b0,b1].forEach(function(c){Object.keys(c.names).forEach(function(n){names[n]=1;});});
  function eq(p,q){return Math.abs(p-q)<=1e-9*Math.max(1,Math.abs(p),Math.abs(q));}
  var dir=true,swp=true;
  for(var t=0;t<8;t++){
    var env={};Object.keys(names).forEach(function(n){env[n]=1.3+Math.random()*7;});
    var x0=a0.f(env),x1=a1.f(env),y0=b0.f(env),y1=b1.f(env);
    if(!(eq(x0,y0)&&eq(x1,y1))) dir=false;
    if(!(eq(x0,y1)&&eq(x1,y0))) swp=false;
  }
  return dir||swp;
}
var KBS={cur:null,n:0,ok:0,done:false,line:[],bank:[]};
function kbNext(){
  var f=kWeighted(KB,function(x){return 'b:'+x.id;}),toks=f.tok.slice(),others=[];
  KB.forEach(function(o){if(o.id!==f.id&&o.l===f.l) o.tok.forEach(function(t){if(/^[\p{L}]/u.test(t)&&toks.indexOf(t)<0&&others.indexOf(t)<0) others.push(t);});});
  var dec=shuffle(others).slice(0,2),ops=['+','−','/','·','²'].filter(function(o){return toks.indexOf(o)<0;});
  if(ops.length) dec.push(pick(ops));
  KBS.cur=f;KBS.bank=shuffle(toks.concat(dec)).map(function(t,i){return {t:t,used:false};});KBS.line=[];KBS.done=false;kbShow();
}
function kbShow(){
  var c=KBS.cur;

   "<div class='kline'>"+(KBS.line.length?KBS.line.map(function(bi){return "<span class='ktk'>"+esc(KBS.bank[bi].t)+"</span>";}).join(''):"<span class='kph'>koppints az elemekre a megfelelő sorrendben</span>")+"</div>"+
   "<div class='kbank'>"+KBS.bank.map(function(b,i){return "<button class='ktk tkb"+(b.used?' used':'')+"' data-bi='"+i+"'"+(b.used?' disabled':'')+">"+esc(b.t)+"</button>";}).join('')+"</div>"+
   "<div class='gacts' style='margin-top:12px'><button class='btn ghost' id='kUndo'>⌫ Vissza</button><button class='btn ghost' id='kClr'>Törlés</button><button class='btn' id='kChk'>Ellenőrzés</button></div><div id='kbFb'></div>";
  app.innerHTML=h;
  document.getElementById('kbBack').onclick=kepSetup;
  [].forEach.call(app.querySelectorAll('[data-bi]'),function(b){b.onclick=function(){if(KBS.done) return;var i=+b.getAttribute('data-bi');KBS.bank[i].used=true;KBS.line.push(i);kbShow();};});
  document.getElementById('kUndo').onclick=function(){if(KBS.done||!KBS.line.length) return;KBS.bank[KBS.line.pop()].used=false;kbShow();};
  document.getElementById('kClr').onclick=function(){if(KBS.done) return;KBS.line.forEach(function(i){KBS.bank[i].used=false;});KBS.line=[];kbShow();};
  document.getElementById('kChk').onclick=kbCheck;
}
function kbCheck(){
  if(KBS.done||!KBS.line.length) return;KBS.done=true;
  var c=KBS.cur,tokens=KBS.line.map(function(i){return KBS.bank[i].t;}),ok=kbEq(tokens,c.tok);
  KBS.n++;if(ok)KBS.ok++;pRecord('kep-e',ok);
  kMiss['b:'+c.id]=ok?Math.max(0,(kMiss['b:'+c.id]||0)-1):(kMiss['b:'+c.id]||0)+1;save('si_f_miss',kMiss);
  document.getElementById('kbFb').innerHTML="<div class='pres'><div class='verdict "+(ok?'ok':'bad')+"'>"+(ok?'Helyes!':'Nem ez a képlet.')+"</div>"+(ok?'':"<p>Te ezt raktad össze: <b>"+esc(tokens.join(' '))+"</b></p>")+"<p><b>"+esc(c.e)+"</b></p><p>"+esc(kCap(c.p))+".</p><button class='btn' id='kbNext'>Következő</button></div>";
  document.getElementById('kbNext').onclick=kbNext;document.querySelector('.count').textContent='összesen: '+KBS.ok+' / '+KBS.n+' jó';
}

var _buShow=buShow,_buCheck=buCheck;
buShow=function(c,it){
  if(c.type==='qn') return it.qn;if(c.type==='qs') return it.qs;if(c.type==='un') return it.un;if(c.type==='us') return it.us;
  return _buShow(c,it);
};
buCheck=function(c,it,raw){
  var t=c.type;
  if(t==='qn'){var a=nrm(raw);return a!==''&&a===nrm(it.qn);}
  if(t==='qs'){var x=symNorm(raw);return x!==''&&[it.qs].concat(it.qalts).some(function(s){return symNorm(s)===x;});}
  if(t==='un'){var b=nrm(raw);return b!==''&&[it.un].concat(it.ualts).some(function(s){return nrm(s)===b;});}
  if(t==='us'){var y=symNorm(raw);return y!==''&&y===symNorm(it.us);}
  return _buCheck(c,it,raw);
};
