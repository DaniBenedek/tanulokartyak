<!DOCTYPE html>
<html lang="hu" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="google" content="notranslate">
<meta http-equiv="Content-Language" content="hu">
<title>SI kártyák</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#E9EDF1; --panel:#FFFFFF; --ink:#14202B; --muted:#5B6B79; --line:#C9D1D9;
  --card:#14202B; --cardtext:#F4F6F8; --cardmuted:#9FB0BF; --accent:#F2A900; --accent-ink:#14202B;
  --ok:#2F7D5B; --no:#C2412D;
  --display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E151C; --panel:#16212B; --ink:#E8EDF2; --muted:#8D9DAB; --line:#2A3A49;
    --card:#1E2F3F; --cardtext:#F4F6F8; --cardmuted:#9FB0BF; --ok:#3FA377; --no:#E0624D;
  }
}
:root[data-theme="dark"]{
  --bg:#0E151C; --panel:#16212B; --ink:#E8EDF2; --muted:#8D9DAB; --line:#2A3A49;
  --card:#1E2F3F; --cardtext:#F4F6F8; --cardmuted:#9FB0BF; --ok:#3FA377; --no:#E0624D;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;}
main{max-width:560px;margin:0 auto;padding:18px 16px 40px;}
h1{font-family:var(--display);font-weight:700;font-size:40px;line-height:1;margin:6px 0 4px;letter-spacing:.01em;}
h2{font-family:var(--display);font-weight:600;font-size:24px;margin:0 0 4px;}
p{margin:0 0 10px;}
.sub{color:var(--muted);margin-bottom:18px;}
button{font:inherit;cursor:pointer;}
button:focus-visible,textarea:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:600;background:var(--accent);color:var(--accent-ink);min-height:48px;}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);}
.btn.small{padding:8px 12px;min-height:40px;font-size:14px;}
.btn.ok{background:var(--ok);color:#fff;}
.btn.no{background:var(--no);color:#fff;}
.opts{display:flex;flex-direction:column;gap:8px;margin:0 0 18px;padding:12px 14px;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;}
.opts label{display:flex;align-items:center;gap:10px;min-height:32px;}
.opts input{width:20px;height:20px;accent-color:var(--accent);}
.deck{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;}
.deck .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.deck .meta{color:var(--muted);font-size:14px;margin-bottom:10px;}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:12px;}
.bar > span{display:block;height:100%;background:var(--ok);}
.deck .acts{display:flex;gap:8px;flex-wrap:wrap;}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;}
.count{color:var(--muted);font-size:14px;}
.scene{perspective:1200px;margin-bottom:16px;}
.card{position:relative;width:100%;min-height:300px;height:52vh;max-height:420px;transform-style:preserve-3d;transition:transform .35s ease;cursor:pointer;touch-action:pan-y;}
.card.flipped{transform:rotateY(180deg);}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;background:var(--card);color:var(--cardtext);padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:auto;}
.face.back{transform:rotateY(180deg);border:3px solid var(--accent);}
.face .tag{position:absolute;top:12px;left:16px;right:16px;font-size:13px;color:var(--cardmuted);text-align:left;}
.face .txt{font-family:var(--display);font-weight:600;font-size:clamp(30px,9vw,48px);line-height:1.12;overflow-wrap:anywhere;}
.face .txt.long{font-size:clamp(22px,6vw,30px);font-family:var(--body);font-weight:500;line-height:1.35;}
.face .hint{position:absolute;bottom:12px;font-size:13px;color:var(--cardmuted);}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.answers[hidden]{display:none;}
.done{text-align:center;padding:30px 10px;}
.done .big{font-family:var(--display);font-weight:700;font-size:56px;line-height:1;margin-bottom:8px;}
textarea,input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:12px;}
textarea{min-height:200px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;}
.field{margin-bottom:14px;}
.field label{display:block;font-weight:600;margin-bottom:6px;}
.note{font-size:14px;color:var(--muted);}
.err{color:var(--no);font-weight:600;margin-bottom:10px;}
.hidden{display:none !important;}
.ggrid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px 6px;margin-bottom:18px;}
@media (min-width:700px){.ggrid{grid-template-columns:repeat(13,1fr);}}
.gcol{display:flex;flex-direction:column;gap:6px;}
.slot{min-height:52px;border:2px dashed var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;padding:2px;background:var(--panel);}
.slot.ok{border:2px solid var(--ok);}
.slot.bad{border:2px solid var(--no);}
.slot.locked{border-style:solid;}
.bank{display:flex;flex-wrap:wrap;gap:8px;min-height:64px;padding:10px;border:2px dashed var(--line);border-radius:12px;margin-bottom:14px;}
.chip{user-select:none;-webkit-user-select:none;touch-action:none;cursor:grab;border-radius:8px;padding:10px 12px;font-weight:600;min-width:48px;text-align:center;line-height:1.1;}
.chip.p{background:var(--accent);color:var(--accent-ink);font-size:17px;}
.chip.f{background:var(--card);color:var(--cardtext);font-family:var(--display);font-size:24px;}
.chip.sel{outline:3px solid var(--ink);outline-offset:2px;}
.chip.locked{cursor:default;}
.chip sup{font-size:.7em;line-height:0;}
.slot .chip{width:100%;min-width:0;padding:10px 1px;}
.slot .chip.p{font-size:14px;}
.slot .chip.f{font-size:19px;}
.dragghost{position:fixed;z-index:1000;pointer-events:none;margin:0;box-shadow:0 8px 20px rgba(0,0,0,.35);opacity:.95;}
.gl{font-weight:600;margin:0 0 6px;}
.gmsg{min-height:24px;font-weight:600;margin:12px 0;}
.gacts{display:flex;gap:8px;flex-wrap:wrap;}

.hub{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.hub .btn{width:100%;}
@media (max-width:420px){.hub{grid-template-columns:1fr;}}
.ptag{color:var(--muted);font-size:14px;margin-bottom:6px;}
h1 + .ptext{margin-top:12px;}
.ptext{font-size:18px;line-height:1.45;margin:0 0 16px;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:14px;}
.prow{margin-bottom:12px;}
.prow label{display:block;font-weight:600;margin-bottom:4px;}
.pin{display:flex;align-items:center;gap:8px;}
.pin input{flex:1;min-width:0;}
.pu{color:var(--muted);white-space:nowrap;}
.pin input.ok{border-color:var(--ok);border-width:2px;}
.pin input.bad{border-color:var(--no);border-width:2px;}
.pfb{color:var(--no);font-size:14px;font-weight:600;margin-top:3px;}
.pres{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:14px;margin-top:14px;}
.pres ol{margin:6px 0 0 18px;padding:0;}
.pres li{margin-bottom:4px;}
.pres ul{margin:6px 0 12px 18px;padding:0;}
.verdict{font-family:var(--display);font-size:28px;font-weight:700;margin:0 0 6px;}
.verdict.ok{color:var(--ok);}
.verdict.bad{color:var(--no);}
.hvl{display:flex;gap:10px;text-align:left;width:100%;background:var(--panel);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;min-height:48px;}
.hvl .hvn{font-weight:700;color:var(--muted);}
.hvl.bad{border-color:var(--no);border-width:2px;}
.hvl.good{border-color:var(--ok);border-width:2px;}
.hvl.pick{outline:3px solid var(--accent);}
.optgrid{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:14px;}
@media (min-width:640px){.optgrid{grid-template-columns:repeat(3,1fr);}}
.optg{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:8px;color:var(--ink);}
.optg.good{border-color:var(--ok);}
.optg.bad{border-color:var(--no);}
.optg.pick{outline:3px solid var(--accent);}
.optg svg{width:100%;height:auto;display:block;}
.zsec{margin:26px 0 8px;padding-top:8px;border-top:2px solid var(--accent);display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
.zsec h2{margin:0;}
.zq{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;}
.zq .ptext{background:transparent;border:0;padding:0;margin-bottom:10px;font-size:17px;}
.zqh{display:flex;justify-content:space-between;margin-bottom:8px;font-weight:600;}
.timer{font-variant-numeric:tabular-nums;}
.wrow{margin-bottom:12px;}
.wrow .wt{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:3px;}
.bigq{font-family:var(--display);font-weight:600;font-size:clamp(26px,7vw,40px);line-height:1.15;margin:10px 0 16px;overflow-wrap:anywhere;}
@media (prefers-reduced-motion: reduce){.card{transition:none;}}
</style>
</head>

function load(key, def){ try{ var v=localStorage.getItem(key); return v?JSON.parse(v):def; }catch(e){ return def; } }
function save(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }

function allDecks(){
  var b = BUILT.map(function(d){ return {id:d.id,name:d.name,desc:d.desc,custom:false,cards:d.cards}; });
  var c = custom.map(function(d){ return {id:d.id,name:d.name,desc:'Saját pakli',custom:true,cards:d.cards}; });
  return b.concat(c);
}
function keyOf(deck, card){ return deck.id+'|'+card[0]; }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }

/* ---------- Tanulás ---------- */
function startStudy(id){
  var decks = allDecks();
  if(id!=='__all') decks = decks.filter(function(d){return d.id===id;});
  var list = [];
  decks.forEach(function(d){
    d.cards.forEach(function(c){
      var k = keyOf(d,c);
      if(prefs.onlyUnknown && known[k]) return;
      list.push({deckName:d.name, q:c[0], a:c[1], key:k});
    });
  });
  if(!list.length){
    app.innerHTML = '<div class="done"><div class="big">Kész!</div><p>Itt már minden kártyát tudsz. Kapcsold ki a „Csak amit még nem tudok” opciót, ha mégis át akarod nézni.</p><button class="btn" id="back">Vissza</button></div>';
    document.getElementById('back').onclick = home; return;
  }
  session = { queue:shuffle(list), total:list.length, learned:0, misses:0, flipped:false };
  render();
}

function render(){
  var s = session;
  if(!s.queue.length){
    app.innerHTML = '<div class="done"><div class="big">Végeztél!</div><p>'+s.total+' kártya, ebből '+s.misses+'-szor kellett újra próbálkozni.</p>'+
      '<button class="btn" id="again">Újra</button> <button class="btn ghost" id="back">Főoldal</button></div>';
    document.getElementById('back').onclick = home;
    document.getElementById('again').onclick = home;
    return;
  }
  var c = s.queue[0];
  var front = prefs.reverse ? c.a : c.q;
  var back  = prefs.reverse ? c.q : c.a;
  function cls(t){ return t.length>40 ? 'txt long' : 'txt'; }
  app.innerHTML =
    '<div class="topbar"><button class="btn ghost small" id="back">← Vissza</button><span class="count">hátra: '+s.queue.length+' / '+s.total+'</span></div>'+
    '<div class="scene"><div class="card'+(s.flipped?' flipped':'')+'" id="card" tabindex="0" role="button" aria-label="Kártya megfordítása">'+
      '<div class="face front"><div class="tag">'+esc(c.deckName)+'</div><div class="'+cls(front)+'">'+esc(front)+'</div><div class="hint">Koppints a megfordításhoz</div></div>'+
      '<div class="face back"><div class="tag">'+esc(c.deckName)+'</div><div class="'+cls(back)+'">'+esc(back)+'</div></div>'+
    '</div></div>'+
    '<div class="answers" id="ans"'+(s.flipped?'':' hidden')+'>'+
      '<button class="btn no" id="no">Még nem tudom</button>'+
      '<button class="btn ok" id="yes">Tudom</button></div>';
  document.getElementById('back').onclick = home;
  var card = document.getElementById('card');
  card.onclick = flip;
  card.onkeydown = function(e){ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); flip(); } };
  document.getElementById('no').onclick = function(){ answer(false); };
  document.getElementById('yes').onclick = function(){ answer(true); };

  var sx=null;
  card.addEventListener('touchstart',function(e){ sx=e.touches[0].clientX; },{passive:true});
  card.addEventListener('touchend',function(e){
    if(sx===null || !session.flipped) { sx=null; return; }
    var dx=e.changedTouches[0].clientX - sx; sx=null;
    if(Math.abs(dx)>70){ answer(dx>0); card.onclick=null; }
  },{passive:true});
}

function flip(){
  session.flipped = !session.flipped;
  document.getElementById('card').classList.toggle('flipped', session.flipped);
  document.getElementById('ans').hidden = !session.flipped;
}

function answer(ok){
  var s = session; if(!s || !s.queue.length) return;
  if(!s.flipped) return;
  var c = s.queue.shift();
  if(ok){ known[c.key]=true; }
  else { delete known[c.key]; s.misses++; s.queue.splice(Math.min(3,s.queue.length),0,c); }
  save('si_known',known);
  s.flipped = false;
  render();
}

document.addEventListener('keydown',function(e){
  if(!session || !session.queue.length) return;
  if(e.key==='ArrowRight' && session.flipped) answer(true);
  if(e.key==='ArrowLeft' && session.flipped) answer(false);
});

/* ---------- Váltószám-játék ---------- */
var GP=['12','9','6','3','2','1','0','−1','−2','−3','−6','−9','−12'];
var GF=['T','G','M','k','h','da','alap','d','c','m','µ','n','p'];
function powHTML(i){ return '10<sup>'+GP[i]+'</sup>'; }
var gs=null;

function gameNew(easy){
  var ids=[],i;
  for(i=0;i<13;i++) ids.push(i);
  gs={easy:!!easy,pw:[],pf:[],bp:shuffle(ids.slice()),bf:shuffle(ids.slice()),checked:false,msg:'',sel:null};
  for(i=0;i<13;i++){ gs.pw.push(null); gs.pf.push(easy?i:null); }
}

function gChip(kind,id,locked){
  var sel=gs.sel&&gs.sel.kind===kind&&gs.sel.id===id;
  return `<div class='chip ${kind}${locked?' locked':''}${sel?' sel':''}' data-kind='${kind}' data-id='${id}'>${kind==='p'?powHTML(id):esc(GF[id])}</div>`;
}

function gameView(){
  var s=gs,i,h='';
  app.style.maxWidth='900px';
  h+=`<div class='topbar'><button class='btn ghost small' id='gback'>← Vissza</button><span class='count'>húzd, vagy koppints</span></div>`;
  h+=`<h1>Váltószámok</h1><p class='sub'>Rakd sorba a váltószámokat nagytól kicsi felé, és párosítsd mindegyikhez az előtagját.</p>`;
  h+=`<div class='opts'><label><input type='checkbox' id='gEasy'${s.easy?' checked':''}> Könnyebb: az előtagok már a helyükön vannak</label></div>`;
  h+=`<div id='gwrap'><div class='ggrid'>`;
  for(i=0;i<13;i++){
    var pc='',fc='';
    if(s.checked){
      if(s.pw[i]!==null) pc=(s.pw[i]===i)?' ok':' bad';
      if(!s.easy&&s.pf[i]!==null) fc=(s.pf[i]===s.pw[i])?' ok':' bad';
    }
    h+=`<div class='gcol'><div class='slot p${pc}' data-kind='p' data-i='${i}'>${s.pw[i]!==null?gChip('p',s.pw[i],false):''}</div><div class='slot f${fc}${s.easy?' locked':''}' data-kind='f' data-i='${i}'>${s.pf[i]!==null?gChip('f',s.pf[i],s.easy):''}</div></div>`;
  }
  h+=`</div>`;
  h+=`<p class='gl'>Váltószámok</p><div class='bank' data-kind='p'>`+s.bp.filter(function(id){return s.pw.indexOf(id)<0;}).map(function(id){return gChip('p',id,false);}).join('')+`</div>`;
  if(!s.easy){
    h+=`<p class='gl'>Előtagok</p><div class='bank' data-kind='f'>`+s.bf.filter(function(id){return s.pf.indexOf(id)<0;}).map(function(id){return gChip('f',id,false);}).join('')+`</div>`;
  }
  h+=`<div class='gmsg' role='status' aria-live='polite'>${esc(s.msg)}</div>`;
  h+=`<div class='gacts'><button class='btn' id='gCheck'>Ellenőrzés</button><button class='btn ghost' id='gShuf'>Új keverés</button><button class='btn ghost' id='gSolve'>Megoldás</button></div></div>`;
  app.innerHTML=h;

  document.getElementById('gback').onclick=home;
  document.getElementById('gEasy').onchange=function(e){ save('si_game_easy',e.target.checked); gameNew(e.target.checked); gameView(); };
  document.getElementById('gCheck').onclick=gCheck;
  document.getElementById('gShuf').onclick=function(){ gameNew(gs.easy); gameView(); };
  document.getElementById('gSolve').onclick=function(){
    for(var k=0;k<13;k++){ gs.pw[k]=k; gs.pf[k]=k; }
    gs.checked=true; gs.msg='Ez a helyes sorrend és párosítás.'; gs.sel=null; gameView();
  };
  var w=document.getElementById('gwrap');
  w.addEventListener('pointerdown',gDown);
  w.addEventListener('click',gClick);
}

function gArr(kind){ return kind==='p'?gs.pw:gs.pf; }

function gPlaceAt(kind,id,i){
  var s=gs;
  if(kind==='f'&&s.easy) return;
  var arr=gArr(kind), origin=arr.indexOf(id), displaced=arr[i];
  if(origin===i){ s.sel=null; gameView(); return; }
  if(origin>=0) arr[origin]=null;
  arr[i]=id;
  if(origin>=0&&displaced!==null) arr[origin]=displaced;
  s.checked=false; s.msg=''; s.sel=null;
  gameView();
}

function gToBank(kind,id){
  if(kind==='f'&&gs.easy) return;
  var arr=gArr(kind), o=arr.indexOf(id);
  if(o>=0) arr[o]=null;
  gs.checked=false; gs.msg=''; gs.sel=null;
  gameView();
}

function gTap(kind,id){
  var s=gs;
  if(s.sel&&s.sel.kind===kind&&s.sel.id===id){ s.sel=null; }
  else if(s.sel&&s.sel.kind===kind){
    var idx=gArr(kind).indexOf(id);
    if(idx>=0&&!(kind==='f'&&s.easy)){ var prev=s.sel; s.sel=null; gPlaceAt(kind,prev.id,idx); return; }
    s.sel={kind:kind,id:id};
  } else { s.sel={kind:kind,id:id}; }
  gameView();
}

function gClick(e){
  var s=gs;
  if(!s||!s.sel||e.target.closest('.chip')) return;
  var slot=e.target.closest('.slot'), bank=e.target.closest('.bank');
  if(slot&&slot.getAttribute('data-kind')===s.sel.kind) gPlaceAt(s.sel.kind,s.sel.id,+slot.getAttribute('data-i'));
  else if(bank&&bank.getAttribute('data-kind')===s.sel.kind) gToBank(s.sel.kind,s.sel.id);
}

function gDown(e){
  var chip=e.target.closest('.chip');
  if(!chip||chip.classList.contains('locked')) return;
  e.preventDefault();
  var r=chip.getBoundingClientRect();
  var st={kind:chip.getAttribute('data-kind'),id:+chip.getAttribute('data-id'),x:e.clientX,y:e.clientY,dx:e.clientX-r.left,dy:e.clientY-r.top,ghost:null,moved:false,pid:e.pointerId};
  function move(ev){
    if(ev.pointerId!==st.pid) return;
    if(!st.moved&&Math.hypot(ev.clientX-st.x,ev.clientY-st.y)>6){
      st.moved=true;
      var g=chip.cloneNode(true);
      g.className+=' dragghost'; g.style.width=r.width+'px';
      document.body.appendChild(g); st.ghost=g; chip.style.opacity='.3';
    }
    if(st.moved){ st.ghost.style.left=(ev.clientX-st.dx)+'px'; st.ghost.style.top=(ev.clientY-st.dy)+'px'; }
  }
  function up(ev){
    if(ev.pointerId!==st.pid) return;
    document.removeEventListener('pointermove',move);
    document.removeEventListener('pointerup',up);
    document.removeEventListener('pointercancel',up);
    if(st.ghost) st.ghost.remove();
    chip.style.opacity='';
    if(st.moved){
      if(ev.type==='pointercancel') return;
      var t=document.elementFromPoint(ev.clientX,ev.clientY);
      var tgt=t&&t.closest('.slot,.bank');
      if(!tgt||tgt.getAttribute('data-kind')!==st.kind) return;
      if(tgt.classList.contains('bank')) gToBank(st.kind,st.id);
      else gPlaceAt(st.kind,st.id,+tgt.getAttribute('data-i'));
    } else {
      gTap(st.kind,st.id);
    }
  }
  document.addEventListener('pointermove',move);
  document.addEventListener('pointerup',up);
  document.addEventListener('pointercancel',up);
}

function gCheck(){
  var s=gs,pOk=0,fOk=0,i;
  for(i=0;i<13;i++){
    if(s.pw[i]===i) pOk++;
    if(s.pf[i]!==null&&s.pf[i]===s.pw[i]) fOk++;
  }
  s.checked=true; s.sel=null;
  if(pOk===13&&(s.easy||fOk===13)) s.msg='Tökéletes! Minden a helyén van.';
  else if(s.easy) s.msg=pOk+'/13 váltószám van a helyén.';
  else s.msg=pOk+'/13 váltószám van a helyén, '+fOk+'/13 előtag passzol a fölötte lévő váltószámhoz.';
  gameView();
}

/* ===================== GYAKORLÁS: feladatgenerátorok ===================== */
/*GEN-START*/
function rint(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
var SUPM={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻'};
function sup(n){return String(n).split('').map(function(c){return SUPM[c]||c;}).join('');}
function ex10(e){return '10'+sup(e);}
function pfmt(x){
  if(!isFinite(x)) return String(x);
  if(x===0) return '0';
  var ax=Math.abs(x);
  if(ax>=1e7||ax<1e-3){
    var e=Math.floor(Math.log10(ax)), m=x/Math.pow(10,e);
    m=+m.toPrecision(4);
    if(Math.abs(m)>=10){m=m/10;e+=1;}
    return String(m).replace('.',',')+'·10'+sup(e);
  }
  var r=+x.toPrecision(5), s=String(r);
  if(s.indexOf('e')>-1) s=r.toFixed(6).replace(/0+$/,'').replace(/\.$/,'');
  var parts=s.split('.'), ip=parts[0], neg=false;
  if(ip.charAt(0)==='-'){neg=true;ip=ip.slice(1);}
  if(ip.length>4) ip=ip.replace(/\B(?=(\d{3})+(?!\d))/g,'\u00a0');
  return (neg?'−':'')+ip+(parts[1]?','+parts[1]:'');
}
var G=9.81;
function par(x){return x<0?'('+pfmt(x)+')':pfmt(x);}
var PXE={'T':12,'G':9,'M':6,'k':3,'h':2,'da':1,'':0,'d':-1,'c':-2,'m':-3,'µ':-6,'n':-9,'p':-12};
function PT(q,unit,val,tol){return {q:q,unit:unit||'',val:val,tol:tol||0.015};}
function TX(q,txt,cs){return {q:q,unit:'',txt:txt,cs:!!cs};}

/* ---------- 1. óra: mértékegység-váltás ---------- */
function genAtvPrefix(){
  var fam=pick(['m','N','W','J']);
  var pool=fam==='m'?['k','','d','c','m','µ','n','p']:['T','G','M','k','','m','µ','n','p'];
  var a=pick(pool),b;do{b=pick(pool);}while(b===a);
  var v=pick([2,3,4,5,6,7,15,25,30,40,50,60,70,120,300,750]);
  var ea=PXE[a],eb=PXE[b],d=ea-eb,val=v*Math.pow(10,d),ua=a+fam,ub=b+fam;
  return {text:'Váltsd át: '+v+' '+ua+' → '+ub,parts:[PT('eredmény',ub,val,0.005)],
    steps:['1 '+ua+' = '+ex10(ea)+' '+fam+', 1 '+ub+' = '+ex10(eb)+' '+fam,
           'Szorzó: '+ex10(ea)+' / '+ex10(eb)+' = '+ex10(d),
           v+' · '+ex10(d)+' = '+pfmt(val)+' '+ub]};
}
function genAtvAreaVol(){
  var n=pick([2,3]),pool=['k','','d','c','m'];
  var a=pick(pool),b;do{b=pick(pool);}while(b===a);
  var v=pick([2,3,4,5,7,12,30,300,5000,300000]);
  var ea=PXE[a],eb=PXE[b],d=ea-eb,dn=d*n,val=v*Math.pow(10,dn);
  var ua=a+'m'+sup(n),ub=b+'m'+sup(n);
  return {text:'Váltsd át: '+pfmt(v)+' '+ua+' → '+ub,parts:[PT('eredmény',ub,val,0.005)],
    steps:['1 '+a+'m = '+ex10(d)+' '+b+'m',
           (n===2?'Négyzetes mennyiségnél (területnél)':'Köbös mennyiségnél (térfogatnál)')+' a prefix-szorzó '+(n===2?'négyzetre':'köbre')+' emelkedik: ('+ex10(d)+')'+sup(n)+' = '+ex10(dn),
           pfmt(v)+' · '+ex10(dn)+' = '+pfmt(val)+' '+ub]};
}
function genAtvSpeed(){
  if(Math.random()<0.5){
    var v=pick([18,36,54,72,90,108,126,144,360]);
    return {text:'Hány m/s a '+v+' km/h?',parts:[PT('sebesség','m/s',v/3.6,0.005)],steps:['km/h → m/s: ÷ 3,6',v+' / 3,6 = '+pfmt(v/3.6)+' m/s']};
  }
  var w=pick([5,10,15,20,25,30,40]);
  return {text:'Hány km/h a '+w+' m/s?',parts:[PT('sebesség','km/h',w*3.6,0.005)],steps:['m/s → km/h: × 3,6',w+' · 3,6 = '+pfmt(w*3.6)+' km/h']};
}
function genAtvRate(){
  var k=rint(0,3),v;
  if(k===0){v=pick([120,300,450,600,1200]);
    return {text:'Váltsd át: '+v+' ford/perc → ford/óra',parts:[PT('eredmény','ford/óra',v*60,0.005)],steps:['1 óra = 60 perc, tehát ×60',v+' · 60 = '+pfmt(v*60)+' ford/óra']};}
  if(k===1){v=pick([60,120,180,300,600]);
    return {text:'Váltsd át: '+v+' ford/perc → ford/s',parts:[PT('eredmény','ford/s',v/60,0.005)],steps:['1 perc = 60 s, tehát ÷ 60',v+' / 60 = '+pfmt(v/60)+' ford/s']};}
  if(k===2){v=pick([30,60,90,120,180]);
    return {text:'Váltsd át: '+v+' m³/h → dm³/perc',parts:[PT('eredmény','dm³/perc',v*1000/60,0.005)],
      steps:['1 m³ = 1000 dm³ (köbös mennyiség: a szorzó köbre emelkedik), 1 óra = 60 perc',v+' m³/h = '+pfmt(v*1000)+' dm³/h',pfmt(v*1000)+' / 60 = '+pfmt(v*1000/60)+' dm³/perc']};}
  v=pick([5,10,20,30]);
  return {text:'Váltsd át: '+v+' km/s → m/h',parts:[PT('eredmény','m/h',v*1000*3600,0.005)],
    steps:['1 km = 1000 m, 1 óra = 3600 s',v+' km/s = '+pfmt(v*1000)+' m/s',pfmt(v*1000)+' · 3600 = '+pfmt(v*3.6e6)+' m/h']};
}
function genAtvAzon(){
  var it=pick([['kg·m/s²','N','1 N = 1 kg·m/s² (definíció szerinti azonosság)'],['N·m','J','1 J = 1 N·m (azonosság)'],['dm³','l','1 l = 1 dm³'],['cm³','ml','1 ml = 1 cm³']]);
  var v=pick([2,6,7,12,50,75]);
  return {text:'Váltsd át: '+v+' '+it[0]+' → '+it[1],parts:[PT('eredmény',it[1],v,0.005)],steps:[it[2],'Nincs szorzó, csak átnevezés: '+v+' '+it[1]]};
}

/* ---------- 2. óra: kinematika ---------- */
function genKinEgy(){
  var v=pick([0.5,0.8,1.2,1.5,2,2.5]),t=pick([10,15,20,24,25,30,40]),s=Math.round(v*t*10)/10;
  return {text:'Egy szállítószalag '+pfmt(v)+' m/s sebességgel halad. Mennyi idő alatt tesz meg '+pfmt(s)+' m-t, és hány km/h ez a sebesség?',
    parts:[PT('idő','s',s/v),PT('sebesség','km/h',v*3.6)],
    steps:['t = s/v = '+pfmt(s)+'/'+pfmt(v)+' = '+pfmt(s/v)+' s','Átváltás km/h-ra: v = '+pfmt(v)+' · 3,6 = '+pfmt(v*3.6)+' km/h']};
}
function genKinAllobol(){
  var a=pick([1,1.5,2,2.5,3,4]),t=pick([3,4,5,6,8,10]);
  return {text:'Egy test állóból indul, gyorsulása a = '+pfmt(a)+' m/s², '+t+' s-ig gyorsul. Mekkora a végsebesség és a megtett út?',
    parts:[PT('végsebesség','m/s',a*t),PT('megtett út','m',0.5*a*t*t)],
    steps:['v = a·t = '+pfmt(a)+'·'+t+' = '+pfmt(a*t)+' m/s','s = ½·a·t² = ½·'+pfmt(a)+'·'+t+'² = '+pfmt(0.5*a*t*t)+' m']};
}
function genKinKezdo(){
  var v0=pick([2,3,4,5,6,8]),a=pick([1,1.5,2,2.5,3]),t=pick([4,5,6,8]);
  return {text:'Egy test v₀ = '+v0+' m/s-ról indul, a = '+pfmt(a)+' m/s², '+t+' s-ig. Mekkora a végsebesség és a megtett út?',
    parts:[PT('végsebesség','m/s',v0+a*t),PT('megtett út','m',v0*t+0.5*a*t*t)],
    steps:['v = v₀ + a·t = '+v0+'+'+pfmt(a)+'·'+t+' = '+pfmt(v0+a*t)+' m/s','s = v₀·t + ½·a·t² = '+pfmt(v0*t)+' + '+pfmt(0.5*a*t*t)+' = '+pfmt(v0*t+0.5*a*t*t)+' m']};
}
function genKinFekez(){
  var a=pick([1,1.5,2,2.5,3,4]),t=pick([2,3,4,5,6]),v0=a*t;
  return {text:'Egy szalag '+pfmt(v0)+' m/s-ról fékez a = −'+pfmt(a)+' m/s² lassulással. Mennyi idő alatt áll meg, és mekkora utat tesz meg eddig?',
    parts:[PT('megállási idő','s',t),PT('megtett út','m',v0*t-0.5*a*t*t)],
    steps:['0 = v₀ + a·t → 0 = '+pfmt(v0)+' − '+pfmt(a)+'·t → t = '+pfmt(t)+' s','s = v₀·t + ½·a·t² = '+pfmt(v0*t)+' − '+pfmt(0.5*a*t*t)+' = '+pfmt(v0*t-0.5*a*t*t)+' m']};
}
function genKinVt(){
  var a1,t1,V,a3,t3,t2,tries=0;
  do{a1=pick([1,2,3]);t1=pick([3,4,5]);V=a1*t1;a3=pick([1,1.5,2,2.5,3,4]);t3=V/a3;tries++;}
  while((t3!==Math.round(t3)||t3<2||t3>6)&&tries<300);
  if(t3!==Math.round(t3)){a1=2;t1=5;V=10;a3=2;t3=5;}
  t2=pick([3,4,5,6]);
  var s=0.5*V*t1+V*t2+0.5*V*t3,T1=t1+t2,T=t1+t2+t3;
  return {text:'A v–t grafikon szerint a test 0–'+t1+' s között egyenletesen nő 0-ról '+V+' m/s-ra; '+t1+'–'+T1+' s között állandó '+V+' m/s; '+T1+'–'+T+' s között egyenletesen csökken 0-ra. Mekkora a gyorsulás az egyes szakaszokban, és mennyi a teljes megtett út?',
    parts:[PT('a (0–'+t1+' s)','m/s²',a1),PT('a ('+t1+'–'+T1+' s)','m/s²',0),PT('a ('+T1+'–'+T+' s)','m/s²',-a3),PT('teljes megtett út','m',s)],
    steps:['a₁ = Δv/Δt = '+V+'/'+t1+' = '+pfmt(a1)+' m/s²','a₂ = 0 (állandó sebesség)','a₃ = −'+V+'/'+t3+' = −'+pfmt(a3)+' m/s²',
           'Út = a v–t görbe alatti terület = ½·'+t1+'·'+V+' + '+V+'·'+t2+' + ½·'+t3+'·'+V+' = '+pfmt(s)+' m']};
}
function genKinAt3(){
  for(var tries=0;tries<500;tries++){
    var v0=pick([10,12,15,18]),s0=pick([0,0,20]);
    var d1=rint(3,4),d2=rint(3,6),d3=rint(3,4);
    var a1=pick([2,1.5,-2,-3,-1.5]),a2=0,a3=pick([-3,-2,1.2,1.5,2]);
    var v1=v0+a1*d1,v2=v1,v3=v2+a3*d3;
    if(v1<2||v3<2) continue;
    var s1=v0*d1+0.5*a1*d1*d1,s2=v1*d2,s3=v2*d3+0.5*a3*d3*d3,tot=s1+s2+s3;
    var T1=d1,T2=d1+d2,T3=d1+d2+d3;
    var txt='Egy anyagszállító kocsi gyorsulás-idő függvénye három szakaszból áll: 0–'+T1+' s: a = '+(a1>0?'+':'')+pfmt(a1)+' m/s²; '+T1+'–'+T2+' s: a = 0; '+T2+'–'+T3+' s: a = '+(a3>0?'+':'')+pfmt(a3)+' m/s². Kezdősebesség v₀ = '+v0+' m/s'+(s0?', kezdeti út s₀ = '+s0+' m':'')+'. Mekkora a sebesség a szakaszok végén, és mennyi a teljes megtett út'+(s0?', valamint hol van a kocsi a végén (s)':'')+'?';
    var parts=[PT('v a 1. szakasz végén','m/s',v1),PT('v a 2. szakasz végén','m/s',v2),PT('v a 3. szakasz végén','m/s',v3),PT('teljes megtett út','m',tot)];
    if(s0) parts.push(PT('végállás s','m',s0+tot));
    var steps=['1. szakasz: v = '+v0+' + '+par(a1)+'·'+d1+' = '+pfmt(v1)+' m/s; Δs = '+v0+'·'+d1+' + ½·'+par(a1)+'·'+d1+'² = '+pfmt(s1)+' m',
               '2. szakasz (a = 0): v = '+pfmt(v1)+' m/s; Δs = '+pfmt(v1)+'·'+d2+' = '+pfmt(s2)+' m',
               '3. szakasz: v = '+pfmt(v2)+' + '+par(a3)+'·'+d3+' = '+pfmt(v3)+' m/s; Δs = '+pfmt(v2)+'·'+d3+' + ½·'+par(a3)+'·'+d3+'² = '+pfmt(s3)+' m',
               'Teljes megtett út: '+pfmt(s1)+' + '+pfmt(s2)+' + '+pfmt(s3)+' = '+pfmt(tot)+' m'];
    if(s0) steps.push('Végállás: s = s₀ + út = '+s0+' + '+pfmt(tot)+' = '+pfmt(s0+tot)+' m');
    steps.push('Minden szakasz végsebességét vidd tovább a következő szakasz kezdősebességének!');
    return {text:txt,parts:parts,steps:steps};
  }
}

/* ---------- 3. óra: kinetika, súrlódás, nyomaték, áttétel ---------- */
function genKinetNewton(){
  var m=pick([500,800,1000,1200,1500,2000]),a=pick([1,1.5,2,2.5,3]),F=m*a;
  return {text:'Egy '+m+' kg tömegű targonca F = '+F+' N húzóerő hatására gyorsul, súrlódásmentesnek tekintve. Mekkora a gyorsulása?',
    parts:[PT('gyorsulás','m/s²',a)],steps:['Newton II. törvénye: a = F/m = '+F+'/'+m+' = '+pfmt(a)+' m/s²']};
}
function genKinetSurl(){
  var m=pick([500,800,1000,1200,1500]),mu=pick([0.1,0.15,0.2,0.25,0.3]);
  var N=m*G,Fs=mu*N,F=Math.ceil(Fs*pick([1.4,1.6,1.8,2.0])/100)*100,Fn=F-Fs,a=Fn/m;
  return {text:'Egy '+m+' kg tömegű ládát F = '+F+' N erővel húzunk vízszintesen, a csúszási súrlódási tényező μ = '+pfmt(mu)+'. Mekkora a gyorsulása? (g = 9,81 m/s²)',
    parts:[PT('nyomóerő N','N',N),PT('súrlódási erő F_s','N',Fs),PT('nettó erő F_net','N',Fn),PT('gyorsulás','m/s²',a)],
    steps:['N = m·g = '+m+'·9,81 ≈ '+pfmt(N)+' N','F_s = μ·N = '+pfmt(mu)+'·'+pfmt(N)+' ≈ '+pfmt(Fs)+' N','F_net = F − F_s = '+F+' − '+pfmt(Fs)+' ≈ '+pfmt(Fn)+' N','a = F_net/m = '+pfmt(Fn)+'/'+m+' ≈ '+pfmt(a)+' m/s²','A súrlódás is egy erő: F = m·a-ban mindig a NETTÓ erő számít.']};
}
function genKinetVasut(){
  var k=pick([['tapadási','μ₀',[0.15,0.2,0.25]],['gördülési','μ_g',[0.001,0.002,0.003]],['csúszási','μ',[0.1,0.15,0.2]]]);
  var mt=pick([20,30,40,50,60]),mu=pick(k[2]),N=mt*1000*G,F=mu*N;
  return {text:'Egy '+mt+' tonnás vasúti kocsit kell mozgatni. Mekkora erő kell (N-ban), ha a '+k[0]+' súrlódási tényező '+k[1]+' = '+pfmt(mu)+'? (g = 9,81 m/s²)',
    parts:[PT('szükséges erő','N',F)],steps:['N = m·g = '+pfmt(mt*1000)+'·9,81 = '+pfmt(N)+' N','F = μ·N = '+pfmt(mu)+'·'+pfmt(N)+' ≈ '+pfmt(F)+' N']};
}
function genKinetRud(){
  var L=pick([1000,1500,2000]),k2=pick([250,400,500]),F1=pick([400,500,600,800,1000]),k1=L-k2,F2=F1*k1/k2;
  return {text:L+' mm hosszú rúd, egyik végén F₁ = '+F1+' N lefelé; az alátámasztás a másik végtől '+k2+' mm-re. Mekkora erő kell a másik végén, és mekkora a támaszerő?',
    parts:[PT('F₂','N',F2),PT('támaszerő R','N',F1+F2)],
    steps:['Erőkarok: k₂ = '+k2+' mm (rövid kar), k₁ = '+L+' − '+k2+' = '+k1+' mm','F₁·k₁ = F₂·k₂ → F₂ = '+F1+'·'+k1+'/'+k2+' = '+pfmt(F2)+' N','Mindkét erő lefelé hat: R = F₁ + F₂ = '+F1+' + '+pfmt(F2)+' = '+pfmt(F1+F2)+' N']};
}
function genKinetAttetel(){
  var i,z1,z2,n1,M1;
  if(Math.random()<0.5){
    do{z1=pick([15,18,20,24,30]);i=pick([2,2.5,3,4,5]);z2=z1*i;}while(z2!==Math.round(z2));
    n1=pick([1000,1200,1440,1500,2900]);M1=pick([8,10,12,15,20]);
    return {text:'Fogaskerékpár: hajtó z₁ = '+z1+' fog, n₁ = '+n1+' 1/min; hajtott z₂ = '+z2+' fog; M₁ = '+M1+' Nm. Mekkora az áttétel, a hajtott fordulatszám és a hajtott nyomaték (ideális)?',
      parts:[PT('áttétel i','',i),PT('n₂','1/min',n1/i),PT('M₂','Nm',i*M1)],
      steps:['i = z₂/z₁ = '+z2+'/'+z1+' = '+pfmt(i)+' (i>1 → lassító)','n₂ = n₁/i = '+n1+'/'+pfmt(i)+' = '+pfmt(n1/i)+' 1/min','M₂ = i·M₁ = '+pfmt(i)+'·'+M1+' = '+pfmt(i*M1)+' Nm']};
  }
  var d1,d2;
  do{d1=pick([80,100,120]);i=pick([2,2.5,3]);d2=d1*i;}while(d2!==Math.round(d2));
  n1=pick([1440,1450,2900]);
  return {text:'Szíjhajtás: d₁ = '+d1+' mm, d₂ = '+d2+' mm, n₁ = '+n1+' 1/min. Mennyi az áttétel és a hajtott tárcsa fordulatszáma?',
    parts:[PT('áttétel i','',i),PT('n₂','1/min',n1/i)],steps:['i = d₂/d₁ = '+d2+'/'+d1+' = '+pfmt(i),'n₂ = n₁/i = '+n1+'/'+pfmt(i)+' = '+pfmt(n1/i)+' 1/min']};
}
function genKinetKetfok(){
  var d1=pick([80,100,120]),is=pick([2,2.5,3]),d2=d1*is;
  if(d2!==Math.round(d2)){d1=100;is=3;d2=300;}
  var z1,ig,z2;do{z1=pick([18,20,24]);ig=pick([2,2.5,3]);z2=z1*ig;}while(z2!==Math.round(z2));
  var n=pick([1440,1450,2900]),M=pick([8,10,12,15]),eta=pick([0.95,0.96,0.97]),i=is*ig,ee=eta*eta;
  return {text:'Egy hajtás először szíjhajtás (d₁ = '+d1+' mm, d₂ = '+d2+' mm), majd fogaskerékpár (z₁ = '+z1+', z₂ = '+z2+'). Bemenet '+n+' 1/min, '+M+' Nm; mindkét fokozat hatásfoka η = '+pfmt(eta)+'. Mekkora mindkét fokozat áttétele, az eredő áttétel, a kimeneti fordulatszám, és a kimeneti nyomaték ideálisan és hatásfokkal?',
    parts:[PT('i (szíj)','',is),PT('i (fogaskerék)','',ig),PT('eredő i','',i),PT('kimeneti fordulatszám','1/min',n/i),PT('M_ki ideálisan','Nm',M*i),PT('M_ki hatásfokkal','Nm',M*i*ee,0.02)],
    steps:['i_szíj = d₂/d₁ = '+d2+'/'+d1+' = '+pfmt(is),'i_fog = z₂/z₁ = '+z2+'/'+z1+' = '+pfmt(ig),'Eredő áttétel: i = '+pfmt(is)+'·'+pfmt(ig)+' = '+pfmt(i),'n_ki = n_be/i = '+n+'/'+pfmt(i)+' ≈ '+pfmt(n/i)+' 1/min','M ideálisan = i·M_be = '+pfmt(i)+'·'+M+' = '+pfmt(M*i)+' Nm','η_e = η² = '+pfmt(eta)+'² ≈ '+pfmt(ee)+', így M_ki = '+pfmt(M*i)+'·'+pfmt(ee)+' ≈ '+pfmt(M*i*ee)+' Nm']};
}
function genKinetHarom(){
  var i1=pick([2,2.5,3,4]),i2=pick([2,2.5,3]),i3=pick([2,2,2.5,3]),n=pick([1440,1450,2900]),M=pick([10,15,20,25]),eta=pick([0.95,0.96,0.97]);
  var i=i1*i2*i3,ee=Math.pow(eta,3);
  return {text:'Háromfokozatú hajtómű, fokozatai i₁ = '+pfmt(i1)+', i₂ = '+pfmt(i2)+', i₃ = '+pfmt(i3)+'; bemeneti fordulat '+n+' 1/min; bemeneti nyomaték '+M+' Nm; minden fokozat hatásfoka η = '+pfmt(eta)+'. Mekkora az eredő áttétel, a kimeneti fordulatszám és a kimeneti nyomaték (ideális és hatásfokokkal)?',
    parts:[PT('eredő i','',i),PT('kimeneti fordulatszám','1/min',n/i),PT('M_ki ideálisan','Nm',M*i),PT('M_ki hatásfokokkal','Nm',M*i*ee,0.02)],
    steps:['i = i₁·i₂·i₃ = '+pfmt(i1)+'·'+pfmt(i2)+'·'+pfmt(i3)+' = '+pfmt(i),'n_ki = n_be/i = '+n+'/'+pfmt(i)+' ≈ '+pfmt(n/i)+' 1/min','M_ki ideálisan = i·M_be = '+pfmt(i)+'·'+M+' = '+pfmt(M*i)+' Nm','η_e = η³ = '+pfmt(eta)+'³ ≈ '+pfmt(ee)+', így M_ki ≈ '+pfmt(M*i*ee)+' Nm']};
}
function genKinetKorong(){
  var N=pick([200,300,400,500]),mu=pick([0.3,0.4,0.5]),dm=pick([300,400,500]),r=dm/2000;
  var Fs=mu*N,Mf=Fs*r,W=Mf*2*Math.PI;
  return {text:'Egy korongot N = '+N+' N erővel szorítunk, μ = '+pfmt(mu)+', a korong átmérője '+dm+' mm (r = '+pfmt(r)+' m). Mekkora a súrlódási (fék-) erő, a féknyomaték (M = F_s·r), és a fékezési energia egy teljes fordulat (φ = 2π) alatt (W = M·φ)?',
    parts:[PT('F_s','N',Fs),PT('M_f','Nm',Mf),PT('W','J',W)],
    steps:['F_s = μ·N = '+pfmt(mu)+'·'+N+' = '+pfmt(Fs)+' N','M_f = F_s·r = '+pfmt(Fs)+'·'+pfmt(r)+' = '+pfmt(Mf)+' Nm','W = M_f·2π = '+pfmt(Mf)+'·6,283 ≈ '+pfmt(W)+' J']};
}

/* ---------- 4. óra: teljesítmény, hatásfok, energia, gépkapcsolat ---------- */
function genPowNyomatek(){
  var M=pick([20,25,30,40,50,60]),n=pick([960,1440,1450,1500,2900]),w=2*Math.PI*n/60,P=M*w;

function munkapontSet(){
  for(var tries=0;tries<400;tries++){
    var Q=pick([0.05,0.1,0.1,0.1]),b=pick([500,1000,1500]),d=pick([1000,2000,2500]),C=pick([10,20,25,30]),A=C+(b+d)*Q*Q;
    if(Math.abs(A-Math.round(A))<1e-9) return {Q:Q,b:b,d:d,C:C,A:Math.round(A)};
  }
  return {Q:0.1,b:1000,d:2000,C:20,A:50};
}
function genGkMunk(){
  var s=munkapontSet(),H=s.C+s.d*s.Q*s.Q,q2=(s.A-s.C)/(s.b+s.d);
  return {text:'Szivattyú H_sz = '+s.A+' − '+s.b+'·Q²; rendszer H_r = '+s.C+' + '+s.d+'·Q² (H [m], Q [m³/s]). Hol a munkapont (Q és H)?',
    parts:[PT('Q','m³/s',s.Q),PT('H','m',H)],
    steps:['Egyenlőség: '+s.A+' − '+s.b+'·Q² = '+s.C+' + '+s.d+'·Q²','Rendezés: '+(s.A-s.C)+' = '+(s.b+s.d)+'·Q² → Q² = '+pfmt(q2)+' → Q = '+pfmt(s.Q)+' m³/s','Visszahelyettesítés: H = '+s.C+' + '+s.d+'·'+pfmt(q2)+' = '+pfmt(H)+' m (ellenőrzés: '+s.A+' − '+pfmt(s.b*q2)+' = '+pfmt(H)+' ✓)']};
}

/* ---------- mozgás-modell a diagramokhoz ---------- */
function mkMotion(durs,v0fix){
  for(var tr=0;tr<400;tr++){
    var v=(v0fix!==undefined&&v0fix!==null)?v0fix:pick([0,0,4,6,8]),t=0,segs=[];
    for(var k=0;k<3;k++){
      var d=durs?durs[k]:pick([2,3,4]),ty=pick(['c','a','d']),a=0;
      if(ty==='c'&&v===0) ty='a';
      if(ty==='a') a=pick([1,1.5,2,3]);
      else if(ty==='d'){
        if(v<=0){ty='a';a=pick([1,2]);}
        else{var amax=v/d,c=[1,1.5,2,3].filter(function(x){return x<=amax+1e-9;});
          if(!c.length){ty='c';a=0;}else a=-pick(c);}
      }
      segs.push({t0:t,t1:t+d,a:a,v0:v,ty:ty});v=v+a*d;t+=d;
    }
    var set={};segs.forEach(function(s){set[s.ty]=1;});
    if(Object.keys(set).length>=2) return {segs:segs,T:t};
  }
}
function motionFromSegs(segs){return {segs:segs,T:segs[segs.length-1].t1};}

function stopTimer(){if(window.pTimer){clearInterval(window.pTimer);window.pTimer=null;}}

function fmtTime(ms){var s=Math.floor(ms/1000),m=Math.floor(s/60);s=s%60;return m+':'+(s<10?'0':'')+s;}

function pParse(s){
  s=String(s).trim().toLowerCase();
  s=s.replace(/\s|\u00a0/g,'').replace(/[−–]/g,'-').replace(/,/g,'.');
  s=s.replace(/10([⁰¹²³⁴⁵⁶⁷⁸⁹⁻]+)/g,function(m,g){return '10^'+g.split('').map(function(c){var k='⁰¹²³⁴⁵⁶⁷⁸⁹⁻'.indexOf(c);return k===10?'-':String(k);}).join('');});
  s=s.replace(/[·x*×]10\^?([+-]?\d+)$/,'e$1');
  s=s.replace(/^10\^([+-]?\d+)$/,'1e$1');
  if(!/^[+-]?(\d+\.?\d*|\.\d+)(e[+-]?\d+)?$/.test(s)) return NaN;
  return parseFloat(s);
}
function pCheckPart(p,raw){
  if(p.txt!==undefined){var t=String(raw).trim();return p.cs?t===p.txt:t.toLowerCase()===p.txt.toLowerCase();}
  var v=pParse(raw);if(isNaN(v)) return false;
  if(Math.abs(p.val)<1e-12) return Math.abs(v)<1e-6;
  return Math.abs(v-p.val)/Math.abs(p.val)<=p.tol;
}
function partsHTML(parts,pre){
  return parts.map(function(p,i){
    return "<div class='prow'><label for='"+pre+i+"'>"+esc(p.q)+"</label><div class='pin'><input type='text' id='"+pre+i+"' autocomplete='off' autocapitalize='off' spellcheck='false'>"+(p.unit?"<span class='pu'>"+esc(p.unit)+"</span>":'')+"</div><div class='pfb' id='"+pre+i+"fb'></div></div>";
  }).join('');
}
function pGrade(parts,pre){
  var okc=0;
  parts.forEach(function(p,i){
    var el=document.getElementById(pre+i),ok=pCheckPart(p,el.value);
    if(ok) okc++;
    el.classList.remove('ok','bad');el.classList.add(ok?'ok':'bad');el.readOnly=true;
    document.getElementById(pre+i+'fb').textContent=ok?'':'Helyes: '+(p.txt!==undefined?p.txt:pfmt(p.val))+(p.unit?' '+p.unit:'');
  });
  return okc;
}

function practiceSetup(){
  stopTimer();app.style.maxWidth='';
  var sel=load('si_pr_sel',{}),h=pTop('pBack','')+"<h1>Számolós gyakorlás</h1><p class='sub'>Mindig új számokkal, a tanár feladattípusaiból. Írd be az eredményt, ellenőrzés után látod a lépéseket is. A tizedesvesszőt pontnak is, a hatványt így is beírhatod: 7,5e8 vagy 7,5·10^8.</p><div class='opts'>";
  PTOPICS.forEach(function(t){h+="<label><input type='checkbox' data-topic='"+t.id+"'"+(sel[t.id]===false?'':' checked')+"> "+esc(t.name)+"</label>";});
  h+="<label><input type='checkbox' id='pWeak'"+(PR.weak?' checked':'')+"> Több feladat a gyenge pontjaimból</label></div><button class='btn' id='pStart'>Kezdés</button>";
  app.innerHTML=h;

    var topics=[],s={};
    [].forEach.call(app.querySelectorAll('[data-topic]'),function(c){s[c.getAttribute('data-topic')]=c.checked;if(c.checked)topics.push(c.getAttribute('data-topic'));});
    save('si_pr_sel',s);
    if(!topics.length){topics=PTOPICS.map(function(t){return t.id;});}
    PR.weak=document.getElementById('pWeak').checked;PR.topics=topics;PR.n=0;PR.ok=0;practiceNext();
  };

function weightedPick(pool,weak){
  if(!weak) return pick(pool);
  var w=pool.map(function(t){var s=pstats[t.id];if(!s||s.n<2) return 2;return 1+3*(1-s.ok/s.n);});
  var sum=w.reduce(function(a,b){return a+b;},0),r=Math.random()*sum;
  for(var i=0;i<pool.length;i++){r-=w[i];if(r<=0) return pool[i];}
  return pool[pool.length-1];
}
function practiceNext(){
  var pool=PTYPES.filter(function(t){return PR.topics.indexOf(t.topic)>-1;});
  if(!pool.length) pool=PTYPES;
  var t=weightedPick(pool,PR.weak),p=t.gen();
  PR.cur={type:t,text:p.text,parts:p.parts,steps:p.steps,done:false};
  practiceShow();
}
function practiceShow(){
  var c=PR.cur;
  app.innerHTML=pTop('pEnd','összesen: '+PR.ok+' / '+PR.n+' jó')+"<div class='ptag'>"+esc(c.type.name)+"</div><div class='ptext'>"+esc(c.text)+"</div>"+partsHTML(c.parts,'pp')+
   "<div class='gacts' id='pAct' style='margin-top:14px'><button class='btn' id='pCheck'>Ellenőrzés</button><button class='btn ghost' id='pShow'>Megoldás</button></div><div id='pRes'></div>";
  document.getElementById('pEnd').onclick=practiceSetup;
  document.getElementById('pCheck').onclick=practiceFinish;
  document.getElementById('pShow').onclick=practiceFinish;
  [].forEach.call(app.querySelectorAll('.pin input'),function(el,i,all){
    el.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();if(i<all.length-1) all[i+1].focus();else practiceFinish();}};
  });
  var f=document.getElementById('pp0');if(f) f.focus();
}
function practiceFinish(){
  var c=PR.cur;if(c.done) return;c.done=true;
  var okc=pGrade(c.parts,'pp'),all=okc===c.parts.length;
  PR.n++;if(all) PR.ok++;pRecord(c.type.id,all);
  document.getElementById('pAct').innerHTML="<button class='btn' id='pNext'>Következő feladat</button>";
  document.getElementById('pRes').innerHTML="<div class='pres'><div class='verdict "+(all?'ok':'bad')+"'>"+(all?'Mind helyes!':okc+' / '+c.parts.length+' helyes')+"</div>"+stepsHTML(c.steps)+"</div>";
  document.getElementById('pNext').onclick=practiceNext;document.getElementById('pNext').focus();
  document.querySelector('.count').textContent='összesen: '+PR.ok+' / '+PR.n+' jó';
}

  for(;k<pool.length-1;k++){r-=w[k];if(r<=0) break;}

  var pts=[],s=0;
  m.segs.forEach(function(g){
    var d=g.t1-g.t0;
    if(kind==='a'){pts.push([g.t0,g.a]);pts.push([g.t1,g.a]);}
    else if(kind==='v'){pts.push([g.t0,g.v0]);pts.push([g.t1,g.v0+g.a*d]);}
    else{for(var k=0;k<=12;k++){var tau=d*k/12;pts.push([g.t0+tau,s+g.v0*tau+0.5*g.a*tau*tau]);}s+=g.v0*d+0.5*g.a*d*d;}
  });
  return pts;
}
function dgSVG(m,kind){
  var pts=dgPts(m,kind),W=240,H=140,L=38,R=8,T=14,B=22;
  var ys=pts.map(function(p){return p[1];}),dmin=Math.min.apply(null,ys),dmax=Math.max.apply(null,ys);
  var ymin=Math.min(0,dmin),ymax=Math.max(0,dmax);
  if(ymax===ymin) ymax=ymin+1;
  var pad=(ymax-ymin)*0.1;if(ymin<0) ymin-=pad;ymax+=pad;
  function X(t){return L+(W-L-R)*t/m.T;}
  function Y(y){return T+(H-T-B)*(ymax-y)/(ymax-ymin);}
  var d=pts.map(function(p,i){return (i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1);}).join(' ');
  var name={a:'a [m/s²]',v:'v [m/s]',s:'s [m]'}[kind];
  var svg="<svg viewBox='0 0 "+W+" "+H+"' role='img' aria-label='"+kind+"–t diagram'>"+
    "<line x1='"+L+"' y1='"+Y(0)+"' x2='"+(W-R)+"' y2='"+Y(0)+"' stroke='var(--line)' stroke-width='1.5'/>"+
    "<line x1='"+L+"' y1='"+T+"' x2='"+L+"' y2='"+(H-B)+"' stroke='var(--line)' stroke-width='1.5'/>"+
    "<path d='"+d+"' fill='none' stroke='var(--ink)' stroke-width='2.4' stroke-linejoin='round'/>"+
    "<text x='"+(L+4)+"' y='"+(T-3)+"' font-size='9' fill='var(--muted)'>"+name+"</text>";
  m.segs.map(function(g){return g.t0;}).concat([m.T]).forEach(function(t){
    svg+="<text x='"+X(t)+"' y='"+(H-8)+"' font-size='9' text-anchor='middle' fill='var(--muted)'>"+t+"</text>";
  });
  svg+="<text x='"+(L-4)+"' y='"+(H-8)+"' font-size='9' text-anchor='end' fill='var(--muted)'>t [s]</text>";
  var labs={};labs[0]=1;if(dmax!==0) labs[dmax]=1;if(dmin<0) labs[dmin]=1;
  Object.keys(labs).forEach(function(k){svg+="<text x='"+(L-4)+"' y='"+(Y(+k)+3)+"' font-size='9' text-anchor='end' fill='var(--muted)'>"+pfmt(+k)+"</text>";});
  return svg+"</svg>";
}
function dgSig(m,kind){return JSON.stringify(dgPts(m,kind).map(function(p){return [Math.round(p[0]*10)/10,Math.round(p[1]*10)/10];}));}
function dgText(m){
  return 'Mozgás: '+m.segs.map(function(g){
    var d=g.t1-g.t0,v1=g.v0+g.a*d,x;
    if(g.ty==='c') x='állandó sebességgel halad (v = '+pfmt(g.v0)+' m/s)';
    else if(g.ty==='a') x='egyenletesen gyorsul (v: '+pfmt(g.v0)+' → '+pfmt(v1)+' m/s)';
    else x='egyenletesen lassul (v: '+pfmt(g.v0)+' → '+pfmt(v1)+' m/s)';
    return g.t0+'–'+g.t1+' s: '+x;
  }).join('; ')+'.';
}
function dgOptions(m,kind){
  var correct=dgSig(m,kind),sigs=[correct],opts=[m],tries=0;
  var durs=m.segs.map(function(g){return g.t1-g.t0;});
  while(opts.length<3&&tries<400){
    tries++;var o=mkMotion(durs,m.segs[0].v0);if(!o) continue;
    var sg=dgSig(o,kind);if(sigs.indexOf(sg)>-1) continue;
    sigs.push(sg);opts.push(o);
  }
  return opts;
}
var DG={m:null,kind:'v',opts:[],ci:0,done:false,n:0,ok:0};
function diaStart(){stopTimer();app.style.maxWidth='900px';DG.n=0;DG.ok=0;diaNext();}
function diaNext(){
  DG.kind=pick(['a','v','s']);DG.m=mkMotion();
  var opts=dgOptions(DG.m,DG.kind);
  while(opts.length<3) opts.push(mkMotion());
  var tagged=opts.map(function(o,i){return {m:o,c:i===0};});
  shuffle(tagged);DG.opts=tagged;DG.done=false;diaShow();
}
function diaShow(){
  var kn={a:'gyorsulás–idő (a–t)',v:'sebesség–idő (v–t)',s:'út–idő (s–t)'}[DG.kind];
  var h=pTop('dgBack','összesen: '+DG.ok+' / '+DG.n+' jó')+"<h1>Diagram-gyakorlat</h1><div class='ptext'>"+esc(dgText(DG.m))+"</div><p><b>Melyik a mozgáshoz tartozó "+kn+" diagram?</b></p><div class='optgrid'>";
  DG.opts.forEach(function(o,i){h+="<button class='optg' data-i='"+i+"'>"+dgSVG(o.m,DG.kind)+"</button>";});
  h+="</div><div id='dgFb'></div>";
  app.innerHTML=h;
  document.getElementById('dgBack').onclick=home;
  [].forEach.call(app.querySelectorAll('.optg'),function(b){b.onclick=function(){diaPick(+b.getAttribute('data-i'));};});
}
function diaPick(i){
  if(DG.done) return;DG.done=true;
  var ok=DG.opts[i].c;DG.n++;if(ok)DG.ok++;pRecord('dia-'+DG.kind,ok);
  var bs=app.querySelectorAll('.optg');
  DG.opts.forEach(function(o,j){if(o.c) bs[j].classList.add('good');});
  if(!ok) bs[i].classList.add('bad');
  var all="<div class='optgrid'>"+['a','v','s'].map(function(k){return "<div class='optg' style='border-color:var(--line)'>"+dgSVG(DG.m,k)+"</div>";}).join('')+"</div>";
  document.getElementById('dgFb').innerHTML="<div class='pres'><div class='verdict "+(ok?'ok':'bad')+"'>"+(ok?'Helyes!':'Nem ez a helyes.')+"</div><p>A mozgás mindhárom diagramja:</p>"+all+
   "<ul><li>Az a–t diagram lépcsős: a töréspontoknál ugrik, nem folytonos.</li><li>A v–t diagram folytonos törtvonal; a meredeksége a gyorsulás, a görbe alatti terület a megtett út.</li><li>Az s–t meredeksége a sebesség: a gyorsuló szakaszon felfelé hajló, az egyenletesen egyenes, a lassulón ellaposodó.</li></ul><button class='btn' id='dgNext'>Következő</button></div>";
  document.getElementById('dgNext').onclick=diaNext;document.querySelector('.count').textContent='összesen: '+DG.ok+' / '+DG.n+' jó';
}

/* ---------- Átváltás villámkör ---------- */
var BL=null;
function blitzStart(){
  stopTimer();app.style.maxWidth='';
  var at=PTYPES.filter(function(t){return t.topic==='atv';}),qs=[];
  for(var i=0;i<10;i++){var t=pick(at);qs.push({type:t,p:t.gen()});}
  BL={qs:qs,i:0,t0:Date.now(),res:[]};blitzShow();
  window.pTimer=setInterval(function(){var el=document.getElementById('blTimer');if(el&&BL) el.textContent=fmtTime(Date.now()-BL.t0);},250);
}
function blitzShow(){
  var q=BL.qs[BL.i],p=q.p;
  app.innerHTML=pTop('blBack',"<span class='timer' id='blTimer'>"+fmtTime(Date.now()-BL.t0)+"</span> · "+(BL.i+1)+" / 10")+"<h1>Villámkör</h1><div class='bigq'>"+esc(p.text)+"</div>"+
   "<div class='pin'><input type='text' id='blIn' autocomplete='off' autocapitalize='off' spellcheck='false' placeholder='eredmény'>"+(p.parts[0].unit?"<span class='pu'>"+esc(p.parts[0].unit)+"</span>":'')+"</div><div class='gacts' style='margin-top:14px'><button class='btn' id='blGo'>Tovább</button></div>";
  document.getElementById('blBack').onclick=home;
  var go=function(){
    var raw=document.getElementById('blIn').value,ok=pCheckPart(p.parts[0],raw);
    pRecord(q.type.id,ok);BL.res.push({q:q,raw:raw,ok:ok});BL.i++;
    if(BL.i>=BL.qs.length) blitzEnd();else blitzShow();
  };
  document.getElementById('blGo').onclick=go;
  var inp=document.getElementById('blIn');inp.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();go();}};inp.focus();
}
function blitzEnd(){
  stopTimer();
  var ms=Date.now()-BL.t0,okc=BL.res.filter(function(r){return r.ok;}).length;
  var best=load('si_blitz',null),rec=!best||okc>best.ok||(okc===best.ok&&ms<best.ms);
  if(rec) save('si_blitz',{ok:okc,ms:ms});
  var h=pTop('blBack','')+"<h1>Villámkör kész</h1><div class='pres'><div class='verdict "+(okc>=8?'ok':'bad')+"'>"+okc+" / 10 jó, "+fmtTime(ms)+"</div>"+
    (rec?"<p><b>Új rekord!</b></p>":"<p>Eddigi legjobb: "+best.ok+" / 10, "+fmtTime(best.ms)+"</p>");
  var wrong=BL.res.filter(function(r){return !r.ok;});
  if(wrong.length){h+="<p>Ezeket nézd át:</p>";wrong.forEach(function(r){h+="<div class='wrow'><b>"+esc(r.q.p.text)+"</b><br>Helyes: "+esc(pfmt(r.q.p.parts[0].val)+' '+r.q.p.parts[0].unit)+(r.raw?" (te: "+esc(r.raw)+")":'')+stepsHTML(r.q.p.steps)+"</div>";});}
  h+="<div class='gacts'><button class='btn' id='blAgain'>Új kör</button></div></div>";
  app.innerHTML=h;
  document.getElementById('blBack').onclick=home;document.getElementById('blAgain').onclick=blitzStart;
}

/* ---------- Gyenge pontok ---------- */
function weakView(){
  stopTimer();app.style.maxWidth='';
  var rows=[];
  Object.keys(pstats).forEach(function(id){var s=pstats[id];if(s&&s.n>0) rows.push({id:id,name:STATNAME[id]||id,n:s.n,ok:s.ok,acc:s.ok/s.n});});
  rows.sort(function(a,b){return a.acc-b.acc||b.n-a.n;});
  var h=pTop('wBack','')+"<h1>Gyenge pontjaim</h1>";
  if(!rows.length){h+="<p class='sub'>Még nincs adat. Oldj meg pár feladatot a gyakorló módokban, és itt látod, melyik típus megy a legrosszabbul.</p>";}
  else{
    h+="<p class='sub'>Pontosság típusonként, a leggyengébbtől. A számolós gyakorlásban bekapcsolhatod, hogy ezekből kapj többet.</p>";
    rows.forEach(function(r){h+="<div class='wrow'><div class='wt'><span>"+esc(r.name)+"</span><span>"+r.ok+" / "+r.n+" ("+Math.round(r.acc*100)+"%)</span></div><div class='bar'><span style='width:"+Math.round(r.acc*100)+"%;background:"+(r.acc<0.5?'var(--no)':'var(--ok)')+"'></span></div></div>";});
  }
  h+="<div class='gacts' style='margin-top:14px'><button class='btn' id='wGo'>Gyakorlás a leggyengébbekkel</button>"+(rows.length?"<button class='btn ghost' id='wReset'>Statisztika nullázása</button>":'')+"</div>";
  app.innerHTML=h;
  document.getElementById('wBack').onclick=home;
  document.getElementById('wGo').onclick=function(){PR.weak=true;PR.topics=PTOPICS.map(function(t){return t.id;});PR.n=0;PR.ok=0;practiceNext();};
  var rs=document.getElementById('wReset');
  if(rs) rs.onclick=function(){if(confirm('Biztosan nullázod a statisztikát?')){pstats={};save('si_stats',pstats);weakView();}};
}

/* ---------- Minta ZH szimuláció ---------- */
var ZH=null;
function zhStart(){
  stopTimer();app.style.maxWidth='760px';
  var b=genZhBeugro(),t=genZhTargonca(),h=genZhHajtomu();
  var mcq=[{m:t.motion,c:true}],durs=t.motion.segs.map(function(g){return g.t1-g.t0;}),sigs=[dgSig(t.motion,'v')],tries=0;
  while(mcq.length<3&&tries<400){tries++;var o=mkMotion(durs,t.motion.segs[0].v0);if(!o) continue;var sg=dgSig(o,'v');if(sigs.indexOf(sg)>-1) continue;sigs.push(sg);mcq.push({m:o,c:false});}
  while(mcq.length<3) mcq.push({m:mkMotion(),c:false});
  shuffle(mcq);
  ZH={b:b,t:t,h:h,mcq:mcq,sel:null,t0:Date.now(),done:false};
  zhShow();
  window.pTimer=setInterval(function(){var el=document.getElementById('zhTimer');if(el&&ZH&&!ZH.done) el.textContent=fmtTime(Date.now()-ZH.t0);},500);
}
function zhSubHTML(q,pre){
  var h="<div class='zq'><div class='zqh'><span>"+esc(q.key)+"</span><span>"+(q.pts?q.pts+' pont':'')+"</span></div><div class='ptext'>"+esc(q.text)+"</div>";
  if(q.mcq){
    h+="<div class='optgrid'>";
    ZH.mcq.forEach(function(o,i){h+="<button class='optg' data-zi='"+i+"'>"+dgSVG(o.m,'v')+"</button>";});
    h+="</div>";
  }else h+=partsHTML(q.parts,pre);
  return h+"<div id='"+pre+"res'></div></div>";
}
function zhShow(){
  var Z=ZH,h=pTop('zBack',"<span class='timer' id='zhTimer'>"+fmtTime(Date.now()-Z.t0)+"</span>")+"<h1>Minta ZH</h1><p class='sub'>Dolgozz önállóan, a végén add be. A felépítés és a ponthatárok a tanár minta ZH-jából vannak, a számok minden alkalommal mások. Az idő csak a te méréseden számít, nem korlát.</p><div id='zhSummary'></div>";
  h+="<div class='zsec'><h2>1. Beugró</h2><span>0 pont</span></div>";
  Z.b.forEach(function(q,i){h+=zhSubHTML(q,'zb'+i+'_');});
  h+="<div class='zsec'><h2>2. Kinematika és alap kinetika</h2><span>30 pont</span></div><div class='ptext'>"+esc(Z.t.text)+"</div>";
  Z.t.subs.forEach(function(q,i){h+=zhSubHTML(q,'zt'+i+'_');});
  h+="<div class='zsec'><h2>3. Összetett hajtómű</h2><span>70 pont</span></div><div class='ptext'>"+esc(Z.h.text)+"</div><p class='note'>"+esc(Z.h.note)+"</p>";
  Z.h.subs.forEach(function(q,i){h+=zhSubHTML(q,'zh'+i+'_');});
  h+="<div class='gacts' style='margin-top:16px'><button class='btn' id='zSubmit'>Beadás</button></div>";
  app.innerHTML=h;
  document.getElementById('zBack').onclick=home;
  document.getElementById('zSubmit').onclick=zhSubmit;
  [].forEach.call(app.querySelectorAll('[data-zi]'),function(b){b.onclick=function(){
    if(ZH.done) return;ZH.sel=+b.getAttribute('data-zi');
    [].forEach.call(app.querySelectorAll('[data-zi]'),function(x){x.classList.remove('pick');});b.classList.add('pick');
  };});
}
function zhGrade(score){
  if(score<=50) return 'elégtelen';if(score<=60) return 'elégséges';if(score<=72) return 'közepes';if(score<=85) return 'jó';return 'jeles';
}
function zhSubmit(){
  var Z=ZH;if(Z.done) return;Z.done=true;stopTimer();
  var ms=Date.now()-Z.t0,rows=[],total=0;
  // beugró
  var bOk=0,bAll=0;
  Z.b.forEach(function(q,i){
    var okc=pGrade(q.parts,'zb'+i+'_');bOk+=okc;bAll+=q.parts.length;
    document.getElementById('zb'+i+'_res').innerHTML="<div class='pres'>"+stepsHTML(q.steps)+"</div>";
  });
  var bPass=bOk/bAll>=0.51;
  pRecord('zh-1',bPass);
  function sub(q,pre,tag,sel){
    var pts,okc,full;
    if(q.mcq){
      var good=Z.sel!==null&&Z.mcq[Z.sel].c;
      var bs=app.querySelectorAll('[data-zi]');
      Z.mcq.forEach(function(o,j){if(o.c) bs[j].classList.add('good');});
      if(Z.sel!==null&&!good) bs[Z.sel].classList.add('bad');
      pts=good?q.pts:0;full=good;
    }else{
      okc=pGrade(q.parts,pre);pts=q.pts*okc/q.parts.length;full=okc===q.parts.length;
    }
    total+=pts;
    document.getElementById(pre+'res').innerHTML="<div class='pres'><div class='verdict "+(full?'ok':'bad')+"'>"+(Math.round(pts*10)/10).toString().replace('.',',')+" / "+q.pts+" pont</div>"+stepsHTML(q.steps)+"</div>";
    pRecord(tag,full);
    rows.push([q.key,pts,q.pts]);
  }
  Z.t.subs.forEach(function(q,i){sub(q,'zt'+i+'_','zh-2'+q.key.slice(-1));});
  Z.h.subs.forEach(function(q,i){sub(q,'zh'+i+'_','zh-3'+q.key.slice(-1));});
  var sc=Math.round(total),g=zhGrade(sc);
  var h="<div class='pres'><div class='verdict "+(sc>50?'ok':'bad')+"'>"+sc+" / 100 pont: "+g+"</div><p>Beugró: <b>"+(bPass?'megfelelt':'nem felelt meg')+"</b> ("+bOk+" / "+bAll+" helyes). A valódi ZH-n a beugró a folytatás feltétele.</p><p>Idő: "+fmtTime(ms)+"</p>"+
   "<p class='note'>Ponthatárok a tanár szerint: ≤50 elégtelen · 51–60 elégséges · 61–72 közepes · 73–85 jó · 86+ jeles. A részpontozás becslés: az alkérdésen belüli jó részeredményeket arányosan számoltam, a tanár pontos pontozását nem ismerem.</p>"+
   "<div class='gacts'><button class='btn' id='zAgain'>Új minta ZH</button></div></div>";
  document.getElementById('zhSummary').innerHTML=h;
  document.getElementById('zAgain').onclick=zhStart;
  document.getElementById('zhSummary').scrollIntoView({behavior:'smooth',block:'start'});
  var sb=document.getElementById('zSubmit');if(sb) sb.disabled=true;
}
// asd
home();
